<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>ギフト神経衰弱</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;

  background:#000;

  overflow:hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Yu Gothic",
    sans-serif;
}

button,
input{
  font-family:inherit;
}


/* =====================================================
   9:16 STAGE
===================================================== */

#stage{

  position:fixed;

  width:min(100vw,56.25vh);
  height:min(100vh,177.777vw);

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  background:#111;

  overflow:hidden;
}


/* =====================================================
   GAME
===================================================== */

#game{

  width:100%;
  height:100%;

  padding:8px;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}


/* =====================================================
   HEADER
===================================================== */

.header{

  flex:0 0 7%;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  overflow:hidden;
}

.title{

  font-size:22px;

  font-weight:900;

  line-height:1;

  white-space:nowrap;
}

.subtitle{

  margin-top:5px;

  font-size:12px;

  color:#aaa;

  white-space:nowrap;
}


/* =====================================================
   STATUS
===================================================== */

.status{

  flex:0 0 7%;

  border-radius:9px;

  background:#222;

  display:flex;
  flex-direction:column;

  justify-content:center;
  align-items:center;

  overflow:hidden;
}

.status-main{

  font-size:16px;

  font-weight:900;

  white-space:nowrap;
}

.status-sub{

  margin-top:3px;

  font-size:12px;

  color:#aaa;

  white-space:nowrap;
}


/* =====================================================
   CANDIDATE AREA
===================================================== */

#candidateArea{

  flex:0 0 11%;

  min-height:0;

  display:none;

  flex-direction:column;

  overflow:hidden;
}

.candidate-title{

  flex:0 0 30%;

  display:flex;

  align-items:center;
  justify-content:center;

  color:#ffd400;

  font-size:14px;

  font-weight:900;
}

.candidates{

  flex:1;

  min-height:0;

  display:flex;

  justify-content:center;
  align-items:center;

  gap:6px;

  overflow:hidden;
}

.candidate{

  height:90%;

  aspect-ratio:1/1;

  border:2px solid #ffd400;

  border-radius:9px;

  background:#333;

  color:#fff;

  display:flex;

  justify-content:center;
  align-items:center;

  font-size:24px;

  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 0 8px rgba(255,212,0,.4);
}

.candidate:active{

  transform:scale(.9);

  background:#ffd400;

  color:#111;
}


/* =====================================================
   BOARD
===================================================== */

.board-area{

  flex:1;

  min-height:0;

  display:flex;

  justify-content:center;
  align-items:center;

  overflow:hidden;
}

#board{

  width:100%;
  height:100%;

  display:grid;

  align-content:center;
  justify-content:center;

  overflow:hidden;
}


/* 16 */

#board.c16{

  grid-template-columns:
    repeat(4,1fr);

  gap:5px;
}


/* 24 */

#board.c24{

  grid-template-columns:
    repeat(6,1fr);

  gap:4px;
}


/* 36 */

#board.c36{

  grid-template-columns:
    repeat(6,1fr);

  gap:3px;
}


/* 48 */

#board.c48{

  grid-template-columns:
    repeat(8,1fr);

  gap:2px;
}


/* =====================================================
   CARD
===================================================== */

.card{

  width:100%;

  aspect-ratio:1/1;

  perspective:800px;

  cursor:pointer;
}

.card-inner{

  position:relative;

  width:100%;
  height:100%;

  transform-style:preserve-3d;

  transition:
    transform .28s ease;
}

.card.flipped .card-inner,
.card.matched .card-inner{

  transform:rotateY(180deg);
}

.card-front,
.card-back{

  position:absolute;

  inset:0;

  border-radius:7px;

  overflow:hidden;

  backface-visibility:hidden;
}

.card-back{

  background:
    linear-gradient(
      135deg,
      #3d2ab8,
      #a52bc7
    );

  border:1px solid #fff;

  display:flex;

  justify-content:center;
  align-items:center;
}

.card-back-mark{

  width:65%;

  height:65%;

  border:2px solid rgba(255,255,255,.7);

  border-radius:10px;

  display:flex;

  justify-content:center;
  align-items:center;

  color:#fff;

  font-size:16px;

  font-weight:900;
}

.card-front{

  background:#fff;

  transform:rotateY(180deg);

  display:flex;

  justify-content:center;
  align-items:center;

  text-align:center;
}

.card-front img{

  width:100%;
  height:100%;

  object-fit:cover;
}

.card-text{

  width:100%;

  padding:5px;

  color:#111;

  font-size:15px;

  font-weight:900;

  line-height:1.15;

  word-break:break-word;
}

.card.matched .card-front{

  border:2px solid #ffd400;

  box-shadow:
    0 0 10px #ffd400;
}


/* =====================================================
   BOTTOM
===================================================== */

.bottom{

  flex:0 0 13%;

  min-height:0;

  display:flex;

  flex-direction:column;

  overflow:hidden;
}


/* =====================================================
   GIFTS
===================================================== */

.gifts{

  flex:0 0 48%;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:5px;

  align-items:center;

  overflow:hidden;
}

.gift-btn{

  width:100%;

  height:70%;

  padding:0;

  border:0;

  border-radius:7px;

  background:#333;

  color:#fff;

  font-size:11px;

  font-weight:900;

  white-space:nowrap;

  overflow:hidden;
}

.gift-btn.active{

  background:#ffd400;

  color:#111;
}


/* =====================================================
   CONTROLS
===================================================== */

.controls{

  flex:0 0 52%;

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:5px;

  align-items:center;
}

.control{

  width:100%;

  height:70%;

  border:0;

  border-radius:7px;

  font-size:14px;

  font-weight:900;

  white-space:nowrap;
}

.start{

  background:#ffd400;

  color:#111;
}

.reset{

  background:#444;

  color:#fff;
}

.setting{

  background:#333;

  color:#fff;
}


/* =====================================================
   SETTINGS
===================================================== */

#settings{

  position:fixed;

  inset:0;

  z-index:5000;

  display:none;

  background:#111;

  color:#fff;

  overflow-y:auto;

  -webkit-overflow-scrolling:touch;

  padding:
    15px
    13px
    35px;
}

#settings.show{

  display:block;
}

.settings-inner{

  width:100%;

  max-width:600px;

  margin:0 auto;
}


/* =====================================================
   SETTINGS TITLE
===================================================== */

.settings-title{

  margin:
    0
    0
    18px;

  text-align:center;

  font-size:30px !important;

  font-weight:900;

  line-height:1.2;
}


/* =====================================================
   SECTION
===================================================== */

.section{

  margin-bottom:13px;

  padding:15px;

  background:#222;

  border-radius:12px;
}

.section-title{

  margin:
    0
    0
    13px;

  text-align:center;

  font-size:22px !important;

  font-weight:900;

  line-height:1.3;
}

.gift-info{

  margin:
    0
    0
    13px;

  text-align:center;

  color:#ddd;

  font-size:16px !important;

  line-height:1.7;
}


/* =====================================================
   COUNT
===================================================== */

.count-grid{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:8px;
}

.count-btn{

  min-height:52px;

  border:0;

  border-radius:8px;

  background:#444;

  color:#fff;

  font-size:18px !important;

  font-weight:900;
}

.count-btn.selected{

  background:#ffd400;

  color:#111;
}


/* =====================================================
   PAIR
===================================================== */

.pair-box{

  margin-bottom:12px;

  padding:12px;

  background:#171717;

  border-radius:10px;
}

.pair-header{

  margin-bottom:10px;

  color:#ffd400;

  font-size:20px !important;

  font-weight:900;

  line-height:1.3;
}

.pair-name{

  width:100%;

  min-height:50px;

  margin-bottom:10px;

  padding:9px;

  border:1px solid #666;

  border-radius:7px;

  background:#333;

  color:#fff;

  font-size:18px !important;
}

.card-settings{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:9px;
}

.card-setting{

  padding:9px;

  background:#292929;

  border-radius:8px;
}

.card-label{

  margin-bottom:7px;

  color:#fff;

  font-size:18px !important;

  font-weight:900;
}

.card-text-input{

  width:100%;

  min-height:48px;

  margin-bottom:8px;

  padding:8px;

  border:1px solid #666;

  border-radius:7px;

  background:#333;

  color:#fff;

  font-size:18px !important;
}

.preview{

  width:100%;

  aspect-ratio:1/1;

  margin-bottom:8px;

  border-radius:7px;

  background:#333;

  color:#fff;

  display:flex;

  justify-content:center;
  align-items:center;

  text-align:center;

  overflow:hidden;

  font-size:18px !important;

  font-weight:900;
}

.preview img{

  width:100%;
  height:100%;

  object-fit:cover;
}

.image-label{

  display:block;

  width:100%;

  min-height:48px;

  padding:11px 4px;

  border-radius:7px;

  background:#444;

  color:#fff;

  text-align:center;

  font-size:17px !important;

  font-weight:900;

  line-height:1.3;
}

.image-input{

  display:none;
}


/* =====================================================
   GIFTS SETTINGS
===================================================== */

.gift-setting-row{

  display:grid;

  grid-template-columns:
    1fr
    90px;

  gap:9px;

  margin-bottom:10px;
}

.gift-name-input,
.gift-count-input{

  width:100%;

  min-height:50px;

  padding:9px;

  border:1px solid #666;

  border-radius:7px;

  background:#333;

  color:#fff;

  font-size:18px !important;
}

.gift-count-input{

  text-align:center;

  font-weight:900;
}


/* =====================================================
   COMPLETE IMAGE SETTING
===================================================== */

.complete-preview{

  width:100%;

  height:170px;

  margin-bottom:10px;

  border-radius:9px;

  background:#333;

  color:#aaa;

  display:flex;

  justify-content:center;
  align-items:center;

  text-align:center;

  overflow:hidden;

  font-size:16px !important;
}

.complete-preview img{

  width:100%;
  height:100%;

  object-fit:contain;
}

.complete-label{

  display:block;

  min-height:52px;

  padding:13px;

  border-radius:8px;

  background:#444;

  color:#fff;

  text-align:center;

  font-size:18px !important;

  font-weight:900;
}

.complete-input{

  display:none;
}


/* =====================================================
   SETTING BUTTONS
===================================================== */

.save-btn,
.close-btn{

  width:100%;

  min-height:56px;

  margin-top:9px;

  padding:13px;

  border:0;

  border-radius:9px;

  font-size:19px !important;

  font-weight:900;
}

.save-btn{

  background:#ffd400;

  color:#111;
}

.close-btn{

  background:#444;

  color:#fff;
}


/* =====================================================
   COMPLETE SCREEN
===================================================== */

#completeScreen{

  position:fixed;

  inset:0;

  z-index:6000;

  display:none;

  justify-content:center;
  align-items:center;

  padding:15px;

  background:rgba(0,0,0,.96);
}

#completeScreen.show{

  display:flex;
}

.complete-box{

  width:100%;

  max-width:600px;

  text-align:center;
}

.complete-title{

  margin-bottom:12px;

  color:#ffd400;

  font-size:34px;

  font-weight:900;
}

#completeImage{

  width:100%;

  max-height:70vh;

  object-fit:contain;

  border:3px solid #fff;

  border-radius:9px;

  background:#222;
}

.complete-message{

  margin-top:10px;

  color:#fff;

  font-size:17px;
}

.complete-close{

  width:100%;

  margin-top:12px;

  padding:14px;

  border:0;

  border-radius:9px;

  background:#ffd400;

  color:#111;

  font-size:18px;

  font-weight:900;
}


/* =====================================================
   SMALL SCREEN
===================================================== */

@media(max-height:650px){

  #settings{

    padding-top:9px;
  }

  .settings-title{

    font-size:26px !important;

    margin-bottom:11px;
  }

  .section{

    padding:11px;

    margin-bottom:9px;
  }

  .section-title{

    font-size:20px !important;
  }

  .pair-header{

    font-size:18px !important;
  }

  .card-label{

    font-size:16px !important;
  }

  .pair-name,
  .card-text-input,
  .gift-name-input,
  .gift-count-input{

    font-size:17px !important;

    min-height:44px;
  }

  .image-label{

    font-size:16px !important;
  }

}


/* =====================================================
   VERY NARROW
===================================================== */

@media(max-width:350px){

  .settings-title{

    font-size:25px !important;
  }

  .section-title{

    font-size:19px !important;
  }

  .pair-header{

    font-size:17px !important;
  }

  .card-label{

    font-size:15px !important;
  }

  .pair-name,
  .card-text-input,
  .gift-name-input,
  .gift-count-input{

    font-size:16px !important;
  }

}

</style>
</head>


<body>


<!-- =====================================================
     GAME
===================================================== -->

<div id="stage">

  <div id="game">


    <div class="header">

      <div class="title">
        🎴 ギフト神経衰弱
      </div>

      <div
        class="subtitle"
        id="message"
      >
        指定ギフトで候補を絞れます！
      </div>

    </div>


    <div class="status">

      <div
        class="status-main"
        id="statusMain"
      >
        ゲーム開始！
      </div>

      <div
        class="status-sub"
        id="statusSub"
      >
        ペア 0 / 8
      </div>

    </div>


    <!-- 候補 -->

    <div id="candidateArea">

      <div class="candidate-title">
        🎁 候補カードから選んでね！
      </div>

      <div
        class="candidates"
        id="candidates"
      ></div>

    </div>


    <!-- ボード -->

    <div class="board-area">

      <div
        id="board"
        class="c16"
      ></div>

    </div>


    <!-- 下部 -->

    <div class="bottom">


      <div class="gifts">

        <button
          class="gift-btn"
          data-gift="0"
        >
          ハートミー
        </button>

        <button
          class="gift-btn"
          data-gift="1"
        >
          ドーナツ
        </button>

        <button
          class="gift-btn"
          data-gift="2"
        >
          ギフトA
        </button>

        <button
          class="gift-btn"
          data-gift="3"
        >
          特別ギフト
        </button>

      </div>


      <div class="controls">

        <button
          class="control start"
          id="startBtn"
        >
          🎮 開始
        </button>

        <button
          class="control reset"
          id="resetBtn"
        >
          🔄 リセット
        </button>

        <button
          class="control setting"
          id="settingBtn"
        >
          ⚙️ 設定
        </button>

      </div>


    </div>

  </div>

</div>


<!-- =====================================================
     SETTINGS
===================================================== -->

<div id="settings">

  <div class="settings-inner">


    <div class="settings-title">
      ⚙️ ゲーム設定
    </div>


    <!-- 枚数 -->

    <div class="section">

      <div class="section-title">
        🎴 カード枚数
      </div>

      <div class="count-grid">

        <button
          class="count-btn selected"
          data-count="16"
        >
          16枚
        </button>

        <button
          class="count-btn"
          data-count="24"
        >
          24枚
        </button>

        <button
          class="count-btn"
          data-count="36"
        >
          36枚
        </button>

        <button
          class="count-btn"
          data-count="48"
        >
          48枚
        </button>

      </div>

    </div>


    <!-- ペア -->

    <div class="section">

      <div class="section-title">
        🔗 ペアカード設定
      </div>

      <div class="gift-info">

        例えば「京都」と「八ツ橋」を<br>
        1つのペアにできます。<br>
        文字でも画像でも設定できます。

      </div>

      <div id="pairList"></div>

    </div>


    <!-- ギフト -->

    <div class="section">

      <div class="section-title">
        🎁 指定ギフト設定
      </div>

      <div class="gift-info">

        ギフト名と候補カード枚数を<br>
        自由に変更できます。

      </div>


      <div class="gift-setting-row">

        <input
          class="gift-name-input"
          id="giftName0"
          value="ハートミー"
          placeholder="ギフト名"
        >

        <input
          class="gift-count-input"
          id="giftCount0"
          type="number"
          min="2"
          value="2"
        >

      </div>


      <div class="gift-setting-row">

        <input
          class="gift-name-input"
          id="giftName1"
          value="ドーナツ"
          placeholder="ギフト名"
        >

        <input
          class="gift-count-input"
          id="giftCount1"
          type="number"
          min="2"
          value="4"
        >

      </div>


      <div class="gift-setting-row">

        <input
          class="gift-name-input"
          id="giftName2"
          value="ギフトA"
          placeholder="ギフト名"
        >

        <input
          class="gift-count-input"
          id="giftCount2"
          type="number"
          min="2"
          value="6"
        >

      </div>


      <div class="gift-setting-row">

        <input
          class="gift-name-input"
          id="giftName3"
          value="特別ギフト"
          placeholder="ギフト名"
        >

        <input
          class="gift-count-input"
          id="giftCount3"
          type="number"
          min="2"
          value="8"
        >

      </div>

    </div>


    <!-- 完成画像 -->

    <div class="section">

      <div class="section-title">
        🖼️ 完成画像
      </div>

      <div
        class="complete-preview"
        id="completePreview"
      >
        ここに完成画像が表示されます
      </div>

      <label class="complete-label">

        📷 完成画像を選択

        <input
          class="complete-input"
          id="completeInput"
          type="file"
          accept="image/*"
        >

      </label>

    </div>


    <button
      class="save-btn"
      id="saveBtn"
    >
      💾 保存してゲーム開始
    </button>


    <button
      class="close-btn"
      id="closeBtn"
    >
      ✕ 閉じる
    </button>


  </div>

</div>


<!-- =====================================================
     COMPLETE
===================================================== -->

<div id="completeScreen">

  <div class="complete-box">

    <div class="complete-title">
      🎉 全部完成！ 🎉
    </div>

    <img
      id="completeImage"
      alt="完成画像"
    >

    <div class="complete-message">
      おめでとう！
    </div>

    <button
      class="complete-close"
      id="completeClose"
    >
      🔄 もう一度ゲームする
    </button>

  </div>

</div>


<script>

/* =====================================================
   DATA
===================================================== */

let cardCount = 16;

let matchedPairs = 0;

let firstCard = null;

let secondCard = null;

let lockBoard = false;

let selectedGift = null;

let candidateIndexes = [];

let completeImageData = null;


/* =====================================================
   GIFTS
===================================================== */

let gifts = [

  {
    name:"ハートミー",
    count:2
  },

  {
    name:"ドーナツ",
    count:4
  },

  {
    name:"ギフトA",
    count:6
  },

  {
    name:"特別ギフト",
    count:8
  }

];


/* =====================================================
   PAIRS
===================================================== */

let pairs = [

  ["京都","八ツ橋"],
  ["東京","東京タワー"],
  ["大阪","たこ焼き"],
  ["北海道","カニ"],
  ["沖縄","シーサー"],
  ["福岡","明太子"],
  ["奈良","鹿"],
  ["神奈川","横浜"],
  ["愛知","味噌カツ"],
  ["広島","お好み焼き"],
  ["宮城","牛タン"],
  ["香川","うどん"],
  ["静岡","富士山"],
  ["青森","りんご"],
  ["栃木","餃子"],
  ["熊本","くまモン"],
  ["山梨","ぶどう"],
  ["秋田","きりたんぽ"],
  ["鹿児島","黒豚"],
  ["群馬","温泉"],
  ["石川","金沢"],
  ["千葉","落花生"],
  ["兵庫","神戸牛"],
  ["長野","そば"]

];


let pairImages = [];


/* =====================================================
   ESCAPE
===================================================== */

function esc(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array){

  for(
    let i=array.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );

    [
      array[i],
      array[j]
    ] =
    [
      array[j],
      array[i]
    ];

  }

}


/* =====================================================
   SETTINGS OPEN
===================================================== */

function openSettings(){

  createPairSettings();

  document
    .getElementById("settings")
    .classList.add("show");

}


/* =====================================================
   SETTINGS CLOSE

function closeSettings(){

    .getElementById("settings")

}


/* =====================================================
   CREATE PAIR SETTINGS
===================================================== */

function createPairSettings(){

  const list =
    document.getElementById("pairList");

  list.innerHTML="";


  const count =
    cardCount / 2;


  for(
    let i=0;
    i<count;
    i++
  ){

    if(!pairs[i]){

      pairs[i]=["",""];

    }


    if(!pairImages[i]){

      pairImages[i]={
        a:null,
        b:null
      };

    }


    const box =
      document.createElement("div");

    box.className =
      "pair-box";


    box.innerHTML = `

      <div class="pair-header">
        🔗 ペア ${i+1}
      </div>


      <input
        class="pair-name"
        id="pairName${i}"
        placeholder="ペア名（任意）"
      >


      <div class="card-settings">


        <div class="card-setting">

          <div class="card-label">
            カード①
          </div>


          <input
            class="card-text-input"
            id="pairA${i}"
            value="${esc(pairs[i][0])}"
            placeholder="京都"
          >


          <div
            class="preview"
            id="previewA${i}"
          >
            ${esc(pairs[i][0])}
          </div>


          <label class="image-label">

            📷 画像を設定

            <input
              class="image-input"
              type="file"
              accept="image/*"
              data-index="${i}"
              data-side="a"
            >

          </label>

        </div>


        <div class="card-setting">

          <div class="card-label">
            カード②
          </div>


          <input
            class="card-text-input"
            id="pairB${i}"
            value="${esc(pairs[i][1])}"
            placeholder="八ツ橋"
          >


          <div
            class="preview"
            id="previewB${i}"
          >
            ${esc(pairs[i][1])}
          </div>


          <label class="image-label">

            📷 画像を設定

            <input
              class="image-input"
              type="file"
              accept="image/*"
              data-index="${i}"
              data-side="b"
            >

          </label>

        </div>


      </div>

    `;


    list.appendChild(box);


    /*
       既存画像
    */

    if(pairImages[i].a){

      document
        .getElementById(
          `previewA${i}`
        )
        .innerHTML =
        `<img src="${pairImages[i].a}" alt="">`;

    }


    if(pairImages[i].b){

      document
        .getElementById(
          `previewB${i}`
        )
        .innerHTML =
        `<img src="${pairImages[i].b}" alt="">`;

    }


    /*
       文字プレビュー
    */

    const inputA =
      document.getElementById(
        `pairA${i}`
      );

    const inputB =
      document.getElementById(
        `pairB${i}`
      );


    inputA.addEventListener(
      "input",
      function(){

        if(!pairImages[i].a){

          document
            .getElementById(
              `previewA${i}`
            )
            .textContent =
            this.value;

        }

      }
    );


    inputB.addEventListener(
      "input",
      function(){

        if(!pairImages[i].b){

          document
            .getElementById(
              `previewB${i}`
            )
            .textContent =
            this.value;

        }

      }
    );

  }


  /*
     画像
  */

  document
    .querySelectorAll(".image-input")
    .forEach(input=>{

      input.addEventListener(
        "change",
        function(){

          const file =
            this.files[0];

          if(!file)return;


          const index =
            Number(
              this.dataset.index
            );


          const side =
            this.dataset.side;


          const reader =
            new FileReader();


          reader.onload =
            function(e){

              pairImages[index][side] =
                e.target.result;


              const preview =
                document.getElementById(
                  side === "a"
                  ? `previewA${index}`
                  : `previewB${index}`
                );


              preview.innerHTML =
                `<img src="${e.target.result}" alt="">`;

            };


          reader.readAsDataURL(file);

        }
      );

    });

}

   CARD COUNT
===================================================== */

document

/* =====================================================
   SAVE SETTINGS
===================================================== */

function saveSettings(){

  const count =
    cardCount / 2;


  /*
     ペア
  */

  for(
    let i=0;
    i<count;
    i++
  ){

    const inputA =
      document.getElementById(
        `pairA${i}`
      );

    const inputB =
      document.getElementById(
        `pairB${i}`
      );


    if(inputA){

      pairs[i][0] =
        inputA.value.trim();

    }


    if(inputB){

      pairs[i][1] =
        inputB.value.trim();

    }

  }


  /*
     ギフト
  */

  for(
    let i=0;
    i<4;
    i++
  ){

    const name =
      document.getElementById(
        `giftName${i}`
      );


    const countInput =
      document.getElementById(
        `giftCount${i}`
      );


    gifts[i].name =
      name.value.trim()
      || "ギフト";


    gifts[i].count =
      Math.max(
        2,
        Number(
          countInput.value
        ) || 2
      );

  }


  updateGiftButtons();

  closeSettings();

  startGame();

}


/* =====================================================
   UPDATE GIFT BUTTONS
===================================================== */

function updateGiftButtons(){

  document
    .querySelectorAll(".gift-btn")
    .forEach(
      (btn,index)=>{

        btn.textContent =
          gifts[index].name;

      }
    );

}


/* =====================================================
   CREATE CARDS
===================================================== */

function createCards(){

  const board =
    document.getElementById("board");

  board.innerHTML="";

  board.className =
    "c" + cardCount;


  const data=[];


  for(
    let i=0;
    i<cardCount/2;
    i++
  ){

    const pair =
      pairs[i] || ["",""];


    const images =
      pairImages[i] || {
        a:null,
        b:null
      };


    /*
       カードA
    */

    data.push({

      pairId:i,

      text:pair[0],

      image:images.a

    });


    /*
       カードB
    */

    data.push({

      pairId:i,

      text:pair[1],

      image:images.b

    });

  }


  /*
     シャッフル
  */

  shuffle(data);


  /*
     描画
  */

  data.forEach(
    (item,index)=>{

      const card =
        document.createElement("div");


      card.className =
        "card";


      card.dataset.index =
        index;


      card.dataset.pairId =
        item.pairId;


      let front;


      if(item.image){

        front =
          `<img
            src="${item.image}"
            alt=""
          >`;

      }else{

        front =
          `<div class="card-text">
            ${esc(item.text)}
          </div>`;

      }


      card.innerHTML = `

        <div class="card-inner">

          <div class="card-back">

            <div class="card-back-mark">
              🎴
            </div>

          </div>


          <div class="card-front">

            ${front}

          </div>

        </div>

      `;


      card.addEventListener(
        "click",
        function(){

          selectCard(card);

        }
      );


      board.appendChild(card);

    }
  );

}


/* =====================================================
   SELECT CARD
===================================================== */

function selectCard(card){

  if(lockBoard)return;


  if(
    card.classList.contains("matched")
  ){

    return;

  }


  if(
    card.classList.contains("flipped")
  ){

    return;

  }


  /*
     ギフト候補制限
  */

  if(
    selectedGift !== null &&
    candidateIndexes.length > 0
  ){

    const index =
      Number(
        card.dataset.index
      );


    if(
      !candidateIndexes.includes(index)
    ){

      document
        .getElementById(
          "message"
        )
        .textContent =
        "候補カードから選んでね！";

      return;

    }

  }


  card.classList.add(
    "flipped"
  );


  if(!firstCard){

    firstCard =
      card;


    document
      .getElementById(
        "statusMain"
      )
      .textContent =
      "もう1枚選んでね！";

    return;

  }


  secondCard =
    card;


  /*
     2枚選んだら候補を消す
  */

  clearCandidates();

  checkMatch();

}


/* =====================================================
   CHECK MATCH
===================================================== */

function checkMatch(){

  const firstPair =
    Number(
      firstCard.dataset.pairId
    );


  const secondPair =
    Number(
      secondCard.dataset.pairId
    );


  if(
    firstPair === secondPair
  ){

    firstCard.classList.add(
      "matched"
    );

    secondCard.classList.add(
      "matched"
    );


    matchedPairs++;


    firstCard=null;

    secondCard=null;


    updateStatus();


    document
      .getElementById(
        "statusMain"
      )
      .textContent =
      "🎉 ペア成立！";


    /*
       全部完成
    */

    if(
      matchedPairs >=
      cardCount/2
    ){

      setTimeout(
        showComplete,
        600
      );

    }

  }else{

    lockBoard=true;


    document
      .getElementById(
        "statusMain"
      )
      .textContent =
      "❌ もう一度！";


    setTimeout(
      function(){

        if(firstCard){

          firstCard.classList.remove(
            "flipped"
          );

        }


        if(secondCard){

          secondCard.classList.remove(
            "flipped"
          );

        }


        firstCard=null;

        secondCard=null;

        lockBoard=false;


        document
          .getElementById(
            "statusMain"
          )
          .textContent =
          "もう一度選んでね！";

      },
      850
    );

  }

}


/* =====================================================
   GIFT BUTTON
===================================================== */

document
  .querySelectorAll(".gift-btn")
  .forEach(btn=>{

    btn.addEventListener(
      "click",
      function(){

        activateGift(
          Number(

          )
        );

      }
    );

  });


/* =====================================================
   ★ GIFT CANDIDATES
   ここが今回の重要修正版
===================================================== */

function activateGift(giftIndex){

  if(lockBoard)return;


  selectedGift =
    giftIndex;


  /*
     ボタン表示
  */

  document
    .querySelectorAll(".gift-btn")
    .forEach(btn=>{
      btn.classList.remove(
        "active"
      );
    });


  const active =
    document.querySelector(
      `.gift-btn[data-gift="${giftIndex}"]`
    );


  if(active){

    active.classList.add(
      "active"
    );

  }


  /*
     使用可能なカード
  */

  const cards =
    Array.from(
      document.querySelectorAll(".card")
    );


  const available =
    cards
      .map(
        (card,index)=>({

          card:card,

          index:index,

          pairId:
            Number(
              card.dataset.pairId
            )

        })
      )
      .filter(
        item =>

          !item.card.classList.contains(
            "matched"
          )

          &&

          !item.card.classList.contains(
            "flipped"
          )

      );


  if(
    available.length < 2
  ){

    return;

  }


  /*
     候補枚数
  */

  let candidateCount =
    Number(
      gifts[giftIndex].count
    );


  if(
    !Number.isFinite(
      candidateCount
    )
  ){

    candidateCount=2;

  }


  candidateCount =
    Math.max(
      2,
      candidateCount
    );


  candidateCount =
    Math.min(
      candidateCount,
      available.length
    );


  /*
     =========================================
     ★ ペアごとにグループ化
     =========================================
  */

  const pairMap={};


  available.forEach(
    item=>{

      if(
        !pairMap[item.pairId]
      ){

        pairMap[item.pairId]=[];

      }


      pairMap[item.pairId].push(
        item
      );

    }
  );


  /*
     =========================================
     ★ 完成しているペアだけ抽出
     =========================================
  */

  const completePairs =
    Object.values(pairMap)
      .filter(
        pair =>
          pair.length >= 2
      );


  let selected=[];


  /*
     =========================================
     ★ 必ず1組を最初に入れる
     =========================================
  */

  if(
    completePairs.length > 0
  ){

    const pair =
      completePairs[
        Math.floor(
          Math.random() *
          completePairs.length
        )
      ];


    selected.push(
      pair[0]
    );


    selected.push(
      pair[1]
    );

  }


  /*
     =========================================
     残りをランダム追加
     =========================================
  */

  const used =
    new Set(
      selected.map(
        item=>item.index
      )
    );


  const remaining =
    available.filter(
      item =>
        !used.has(
          item.index
        )
    );


  shuffle(remaining);


  while(
    selected.length <
    candidateCount &&
    remaining.length > 0
  ){

    selected.push(
      remaining.shift()
    );

  }


  /*
     =========================================
     ★ 最終候補をシャッフル
     =========================================
  */

  shuffle(selected);


  candidateIndexes =
    selected.map(
      item=>item.index
    );


  /*
     表示
  */

  showCandidates();


  document
    .getElementById(
      "statusMain"
    )
    .textContent =
    "候補から2枚選んでね！";


  document
    .getElementById(
      "message"
    )
    .textContent =
    gifts[giftIndex].name +
    "：候補が表示されました！";

}


/* =====================================================
   SHOW CANDIDATES
===================================================== */

function showCandidates(){

  const area =
    document.getElementById(
      "candidateArea"
    );


  const list =
    document.getElementById(
      "candidates"
    );


  list.innerHTML="";


  candidateIndexes.forEach(
    index=>{

      const button =
        document.createElement(
          "div"
        );


      button.className =
        "candidate";


      /*
         ★ 候補番号
         ボード上の位置と同じ番号
      */

      button.textContent =
        index+1;


      button.addEventListener(
        "click",
        function(){

          const cards =
            document.querySelectorAll(
              ".card"
            );


          if(
            cards[index]
          ){

            selectCard(
              cards[index]
            );

          }

        }
      );


      list.appendChild(
        button
      );

    }
  );


  area.style.display =
    "flex";

}


/* =====================================================
   CLEAR CANDIDATES
===================================================== */

function clearCandidates(){

  candidateIndexes=[];

  selectedGift=null;


  document
    .getElementById(
      "candidateArea"
    )
    .style.display =
    "none";


  document
    .querySelectorAll(".gift-btn")
    .forEach(btn=>{
      btn.classList.remove(
        "active"
      );
    });

}


/* =====================================================
   STATUS
===================================================== */

function updateStatus(){

  document
    .getElementById(
      "statusSub"
    )
    .textContent =
    "ペア " +
    matchedPairs +
    " / " +
    (cardCount/2);

}


/* =====================================================
   START GAME
===================================================== */

function startGame(){

  matchedPairs=0;

  firstCard=null;

  secondCard=null;

  lockBoard=false;

  clearCandidates();

  createCards();

  updateStatus();


  document
    .getElementById(
      "statusMain"
    )
    .textContent =
    "ギフトを選んでね！";


  document
    .getElementById(
      "message"
    )
    .textContent =
    "指定ギフトで候補を絞れます！";

}


/* =====================================================
   COMPLETE
===================================================== */

function showComplete(){

  const screen =
    document.getElementById(
      "completeScreen"
    );


  const image =
    document.getElementById(
      "completeImage"
    );


  if(
    completeImageData
  ){

    image.src =
      completeImageData;

    image.style.display =
      "block";

  }else{

    image.removeAttribute(
      "src"
    );

    image.style.display =
      "none";

  }


  screen.classList.add(
    "show"
  );

}

document

/* =====================================================
   INITIAL
===================================================== */

updateGiftButtons();

createPairSettings();

startGame();

</script>
