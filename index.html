<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>神経衰弱ゲーム</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;
  color:#fff;
}

button,input{
  font-family:inherit;
}

#stage{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(100vw,56.25vh);
  height:min(100vh,177.777vw);
  overflow:hidden;
  background:#111;
}

#game{
  width:100%;
  height:100%;
  padding:6px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* =========================
   上部
========================= */

.header{
  flex:0 0 6%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.title{
  font-size:21px;
  font-weight:900;
  line-height:1;
}

.subtitle{
  margin-top:3px;
  font-size:10px;
  color:#aaa;
  white-space:nowrap;
}

/* =========================
   ステータス
========================= */

.status{
  flex:0 0 7%;
  background:#222;
  border-radius:8px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.status-main{
  font-size:15px;
  font-weight:900;
}

.status-sub{
  margin-top:2px;
  font-size:11px;
  color:#aaa;
}

/* =========================
   ★ 候補エリア
========================= */

#candidateArea{
  flex:0 0 15%;
  min-height:0;
  display:none;
  flex-direction:column;
  overflow:hidden;
}

.candidate-title{
  flex:0 0 28%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:900;
}

/*
  候補は枚数に応じて
  自動でグリッド配置
*/
.candidates{
  flex:1;
  min-height:0;

  display:grid;

  grid-template-columns:repeat(4,1fr);

  grid-auto-rows:1fr;

  gap:4px;

  padding:2px 12px;

  overflow:hidden;
}

.candidate{
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;

  border:2px solid #ffd400;
  border-radius:8px;

  background:#333;
  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:23px;
  font-weight:900;

  cursor:pointer;
}

.candidate:active{
  transform:scale(.93);
}

/*
  2枚
*/
.candidates.c2{
  grid-template-columns:repeat(2,1fr);
  grid-template-rows:1fr;
  padding-left:28%;
  padding-right:28%;
}

/*
  4枚
*/
.candidates.c4{
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:1fr;
}

/*
  6枚
*/
.candidates.c6{
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(2,1fr);
  padding-left:18%;
  padding-right:18%;
}

/*
  8枚
*/
.candidates.c8{
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(2,1fr);
  padding-left:10%;
  padding-right:10%;
}

/* =========================
   ボード
========================= */

.board-area{
  flex:1;
  min-height:0;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}

#board{
  width:100%;
  height:100%;

  display:grid;

  align-content:center;
  justify-content:center;

  overflow:hidden;
}

#board.c16{
  grid-template-columns:repeat(4,1fr);
  gap:5px;
}

#board.c24{
  grid-template-columns:repeat(6,1fr);
  gap:4px;
}

#board.c36{
  grid-template-columns:repeat(6,1fr);
  gap:3px;
}

#board.c48{
  grid-template-columns:repeat(8,1fr);
  gap:2px;
}

/* =========================
   カード
========================= */

.card{
  width:100%;
  aspect-ratio:1 / 1;
  perspective:800px;
  cursor:pointer;
}

.card-inner{
  position:relative;
  width:100%;
  height:100%;
  transform-style:preserve-3d;
  transition:transform .28s ease;
}

.card.flipped .card-inner,
.card.matched .card-inner{
  transform:rotateY(180deg);
}

/* =========================
   ★ 紫のマス
========================= */

.card-back{
  position:absolute;
  inset:0;

  background:#7b3fa0;

  border:2px solid #b56cff;
  border-radius:7px;

  display:flex;
  align-items:center;
  justify-content:center;

  backface-visibility:hidden;
}

.card-back-number{
  color:#fff;
  font-size:28px;
  font-weight:900;
}

/* =========================
   表
========================= */

.card-front{
  position:absolute;
  inset:0;

  background:#fff;
  color:#111;

  border-radius:7px;

  transform:rotateY(180deg);

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  overflow:hidden;
  backface-visibility:hidden;
}

.card-front img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.card-text{
  padding:4px;
  font-size:14px;
  font-weight:900;
  line-height:1.15;
  word-break:break-word;
}

.card.matched .card-front{
  border:2px solid #ffd400;
  box-shadow:0 0 10px #ffd400;
}

/* =========================
   下部
========================= */

.bottom{
  flex:0 0 13%;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.gifts{
  flex:0 0 48%;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
  align-items:center;
}

.gift-btn{
  width:100%;
  height:70%;

  border:0;
  border-radius:7px;

  background:#333;
  color:#fff;

  font-size:10px;
  font-weight:900;

  white-space:nowrap;
  overflow:hidden;
}

.gift-btn.active{
  background:#ffd400;
  color:#111;
}

.controls{
  flex:0 0 52%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
  align-items:center;
}

.control{
  height:70%;
  border:0;
  border-radius:7px;
  font-size:13px;
  font-weight:900;
}

.start{
  background:#ffd400;
  color:#111;
}

.reset{
  background:#444;
  color:#fff;
}

.setting{
  background:#333;
  color:#fff;
}

/* =========================
   設定
========================= */

#settings{
  position:fixed;
  inset:0;
  z-index:5000;

  display:none;

  background:#111;
  color:#fff;

  overflow-y:auto;

  padding:12px;
}

#settings.show{
  display:block;
}

.settings-inner{
  width:100%;
  max-width:600px;
  margin:auto;
}

.settings-title{
  margin-bottom:12px;
  text-align:center;
  font-size:27px;
  font-weight:900;
}

.section{
  margin-bottom:10px;
  padding:12px;
  background:#222;
  border-radius:11px;
}

.section-title{
  margin-bottom:10px;
  text-align:center;
  font-size:20px;
  font-weight:900;
}

.gift-info{
  margin-bottom:10px;
  text-align:center;
  color:#ddd;
  font-size:14px;
  line-height:1.5;
}

.count-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.count-btn{
  min-height:48px;
  border:0;
  border-radius:8px;
  background:#444;
  color:#fff;
  font-size:17px;
  font-weight:900;
}

.count-btn.selected{
  background:#ffd400;
  color:#111;
}

/* =========================
   ペア設定
========================= */

.pair-box{
  margin-bottom:9px;
  padding:9px;
  background:#171717;
  border-radius:9px;
}

.pair-header{
  margin-bottom:7px;
  color:#c77dff;
  font-size:18px;
  font-weight:900;
}

.pair-name,
.card-text-input,
.gift-name-input,
.gift-count-input{
  width:100%;
  min-height:44px;

  padding:7px;

  border:1px solid #666;
  border-radius:7px;

  background:#333;
  color:#fff;

  font-size:16px;
}

.pair-name{
  margin-bottom:7px;
}

.card-settings{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.card-setting{
  padding:7px;
  background:#292929;
  border-radius:8px;
}

.card-label{
  margin-bottom:5px;
  font-size:15px;
  font-weight:900;
}

.card-text-input{
  margin-bottom:6px;
}

.preview{
  width:100%;
  aspect-ratio:1 / 1;

  margin-bottom:6px;

  border-radius:7px;

  background:#333;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  overflow:hidden;

  font-size:15px;
  font-weight:900;
}

.preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.image-label,
.complete-label{
  display:block;

  min-height:43px;

  padding:10px 5px;

  border-radius:7px;

  background:#444;

  text-align:center;

  font-size:15px;
  font-weight:900;
}

.image-input,
.complete-input{
  display:none;
}

/* =========================
   ギフト設定
========================= */

.gift-setting-row{
  display:grid;
  grid-template-columns:1fr 75px;
  gap:7px;
  margin-bottom:7px;
}

.gift-count-input{
  text-align:center;
  font-weight:900;
}

/* =========================
   完成画像
========================= */

.complete-preview{
  width:100%;
  height:150px;

  margin-bottom:8px;

  border-radius:8px;

  background:#333;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  overflow:hidden;

  color:#aaa;
  font-size:14px;
}

.complete-preview img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.save-btn,
.close-btn{
  width:100%;
  min-height:52px;

  margin-top:7px;

  border:0;
  border-radius:8px;

  font-size:18px;
  font-weight:900;
}

.save-btn{
  background:#ffd400;
  color:#111;
}

.close-btn{
  background:#444;
  color:#fff;
}

/* =========================
   完成画面
========================= */

#completeScreen{
  position:fixed;
  inset:0;

  z-index:6000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:12px;

  background:rgba(0,0,0,.96);
}

#completeScreen.show{
  display:flex;
}

.complete-box{
  width:100%;
  text-align:center;
}

.complete-title{
  margin-bottom:10px;
  color:#ffd400;
  font-size:31px;
  font-weight:900;
}

#completeImage{
  width:100%;
  max-height:70vh;
  object-fit:contain;

  border:3px solid #fff;
  border-radius:8px;
}

.complete-message{
  margin-top:8px;
  font-size:16px;
}

.complete-close{
  width:100%;
  margin-top:10px;
  padding:12px;

  border:0;
  border-radius:8px;

  background:#ffd400;
  color:#111;

  font-size:18px;
  font-weight:900;
}

/* =========================
   高さが小さい場合
========================= */

@media(max-height:650px){

  .title{
    font-size:18px;
  }

  .candidate{
    font-size:20px;
  }

  .card-back-number{
    font-size:23px;
  }

  #candidateArea{
    flex-basis:16%;
  }

  .settings-title{
    font-size:24px;
  }

  .section{
    padding:9px;
  }

}

/* =========================
   非常に小さい画面
========================= */

@media(max-height:560px){

  .header{
    flex-basis:5%;
  }

  .status{
    flex-basis:6%;
  }

  #candidateArea{
    flex-basis:17%;
  }

  .bottom{
    flex-basis:12%;
  }

  .candidate{
    font-size:18px;
  }

  .card-back-number{
    font-size:20px;
  }

}
</style>
</head>

<body>

<div id="stage">

<div id="game">

  <div class="header">
    <div class="title">数字カード神経衰弱</div>
    <div class="subtitle" id="message">
      指定ギフトで候補を絞れます！
    </div>
  </div>

  <div class="status">
    <div class="status-main" id="statusMain">
      ギフトを選んでね！
    </div>

    <div class="status-sub" id="statusSub">
      ペア 0 / 8
    </div>
  </div>

  <!-- 候補 -->
  <div id="candidateArea">

    <div class="candidate-title">
      候補カードから選んでね！
    </div>

    <div
      class="candidates"
      id="candidates">
    </div>

  </div>

  <!-- ボード -->
  <div class="board-area">
    <div id="board" class="c16"></div>
  </div>

  <!-- 下部 -->
  <div class="bottom">

    <div class="gifts">

      <button class="gift-btn" data-gift="0">
        ハートミー
      </button>

      <button class="gift-btn" data-gift="1">
        ドーナツ
      </button>

      <button class="gift-btn" data-gift="2">
        ギフトA
      </button>

      <button class="gift-btn" data-gift="3">
        特別ギフト
      </button>

    </div>

    <div class="controls">

      <button class="control start" id="startBtn">
        開始
      </button>

      <button class="control reset" id="resetBtn">
        リセット
      </button>

      <button class="control setting" id="settingBtn">
        設定
      </button>

    </div>

  </div>

</div>
</div>


<!-- =========================
     設定画面
========================= -->

<div id="settings">

<div class="settings-inner">

  <div class="settings-title">
    ゲーム設定
  </div>

  <div class="section">

    <div class="section-title">
      カード枚数
    </div>

    <div class="count-grid">

      <button class="count-btn selected" data-count="16">
        16枚
      </button>

      <button class="count-btn" data-count="24">
        24枚
      </button>

      <button class="count-btn" data-count="36">
        36枚
      </button>

      <button class="count-btn" data-count="48">
        48枚
      </button>

    </div>

  </div>


  <div class="section">

    <div class="section-title">
      ペアカード設定
    </div>

    <div class="gift-info">
      例：京都＋八ツ橋のように
      自由にペアを設定できます。
    </div>

    <div id="pairList"></div>

  </div>


  <div class="section">

    <div class="section-title">
      指定ギフト設定
    </div>

    <div class="gift-info">
      ギフト名と候補カード枚数を設定できます。
    </div>

    <div class="gift-setting-row">
      <input class="gift-name-input"
             id="giftName0"
             value="ハートミー">

      <input class="gift-count-input"
             id="giftCount0"
             type="number"
             min="2"
             value="2">
    </div>

    <div class="gift-setting-row">
      <input class="gift-name-input"
             id="giftName1"
             value="ドーナツ">

      <input class="gift-count-input"
             id="giftCount1"
             type="number"
             min="2"
             value="4">
    </div>

    <div class="gift-setting-row">
      <input class="gift-name-input"
             id="giftName2"
             value="ギフトA">

      <input class="gift-count-input"
             id="giftCount2"
             type="number"
             min="2"
             value="6">
    </div>

    <div class="gift-setting-row">
      <input class="gift-name-input"
             id="giftName3"
             value="特別ギフト">

      <input class="gift-count-input"
             id="giftCount3"
             type="number"
             min="2"
             value="8">
    </div>

  </div>


  <div class="section">

    <div class="section-title">
      全部揃ったときの完成画像
    </div>

    <div class="complete-preview"
         id="completePreview">
      完成画像を設定してください
    </div>

    <label class="complete-label">
      完成画像を選択

      <input
        class="complete-input"
        id="completeInput"
        type="file"
        accept="image/*">
    </label>

  </div>


  <button class="save-btn" id="saveBtn">
    保存してゲーム開始
  </button>

  <button class="close-btn" id="closeBtn">
    閉じる
  </button>

</div>
</div>


<!-- =========================
     完成画面
========================= -->

<div id="completeScreen">

  <div class="complete-box">

    <div class="complete-title">
      全部完成！
    </div>

    <img id="completeImage" alt="完成画像">

    <div class="complete-message">
      おめでとう！
    </div>

    <button class="complete-close" id="completeClose">
      もう一度ゲームする
    </button>

  </div>

</div>


<script>

/* =====================================
   データ
===================================== */

let cardCount=16;

let matchedPairs=0;

let firstCard=null;
let secondCard=null;

let lockBoard=false;

let selectedGift=null;

let candidateIndexes=[];

let completeImageData=null;


let gifts=[
  {name:"ハートミー",count:2},
  {name:"ドーナツ",count:4},
  {name:"ギフトA",count:6},
  {name:"特別ギフト",count:8}
];


let pairs=[
  ["京都","八ツ橋"],
  ["東京","東京タワー"],
  ["大阪","たこ焼き"],
  ["北海道","カニ"],
  ["沖縄","シーサー"],
  ["福岡","明太子"],
  ["奈良","鹿"],
  ["神奈川","横浜"],
  ["愛知","味噌カツ"],
  ["広島","お好み焼き"],
  ["宮城","牛タン"],
  ["香川","うどん"],
  ["静岡","富士山"],
  ["青森","りんご"],
  ["栃木","餃子"],
  ["熊本","くまモン"],
  ["山梨","ぶどう"],
  ["秋田","きりたんぽ"],
  ["鹿児島","黒豚"],
  ["群馬","温泉"],
  ["石川","金沢"],
  ["千葉","落花生"],
  ["兵庫","神戸牛"],
  ["長野","そば"]
];


let pairImages=[];


/* =====================================
   文字処理
===================================== */

function esc(text){

  return String(text||"")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


/* =====================================
   シャッフル
===================================== */

function shuffle(arr){

  for(
    let i=arr.length-1;
    i>0;
    i--
  ){

    const j=
      Math.floor(
        Math.random()*(i+1)
      );

    [
      arr[i],
      arr[j]
    ]=[
      arr[j],
      arr[i]
    ];

  }

}


/* =====================================
   設定
===================================== */

function openSettings(){

  createPairSettings();

  document
    .getElementById("settings")
    .classList.add("show");

}


function closeSettings(){

  document
    .getElementById("settings")
    .classList.remove("show");

}


/* =====================================
   ペア設定
===================================== */

function createPairSettings(){

  const list=
    document.getElementById("pairList");

  list.innerHTML="";


  const count=
    cardCount/2;


  for(
    let i=0;
    i<count;
    i++
  ){

    if(!pairs[i]){
      pairs[i]=["",""];
    }


    if(!pairImages[i]){
      pairImages[i]={
        a:null,
        b:null
      };
    }


    const box=
      document.createElement("div");

    box.className="pair-box";


    box.innerHTML=`

      <div class="pair-header">
        ペア ${i+1}
      </div>

      <input
        class="pair-name"
        id="pairName${i}"
        placeholder="ペア名（任意）">

      <div class="card-settings">

        <div class="card-setting">

          <div class="card-label">
            カード①
          </div>

          <input
            class="card-text-input"
            id="pairA${i}"
            value="${esc(pairs[i][0])}"
            placeholder="京都">

          <div
            class="preview"
            id="previewA${i}">
            ${esc(pairs[i][0])}
          </div>

          <label class="image-label">
            画像を設定

            <input
              class="image-input"
              type="file"
              accept="image/*"
              data-index="${i}"
              data-side="a">
          </label>

        </div>


        <div class="card-setting">

          <div class="card-label">
            カード②
          </div>

          <input
            class="card-text-input"
            id="pairB${i}"
            value="${esc(pairs[i][1])}"
            placeholder="八ツ橋">

          <div
            class="preview"
            id="previewB${i}">
            ${esc(pairs[i][1])}
          </div>

          <label class="image-label">
            画像を設定

            <input
              class="image-input"
              type="file"
              accept="image/*"
              data-index="${i}"
              data-side="b">
          </label>

        </div>

      </div>
    `;


    list.appendChild(box);


    if(pairImages[i].a){

      document.getElementById(
        `previewA${i}`
      ).innerHTML=
        `<img src="${pairImages[i].a}" alt="">`;

    }


    if(pairImages[i].b){

      document.getElementById(
        `previewB${i}`
      ).innerHTML=
        `<img src="${pairImages[i].b}" alt="">`;

    }


    document
      .getElementById(`pairA${i}`)
      .addEventListener("input",function(){

        if(!pairImages[i].a){

          document.getElementById(
            `previewA${i}`
          ).textContent=this.value;

        }

      });


    document
      .getElementById(`pairB${i}`)
      .addEventListener("input",function(){

        if(!pairImages[i].b){

          document.getElementById(
            `previewB${i}`
          ).textContent=this.value;

        }

      });

  }


  document
    .querySelectorAll(".image-input")
    .forEach(input=>{

      input.addEventListener(
        "change",
        function(){

          const file=this.files[0];

          if(!file)return;


          const index=
            Number(this.dataset.index);

          const side=
            this.dataset.side;


          const reader=
            new FileReader();


          reader.onload=function(e){

            pairImages[index][side]=
              e.target.result;


            const id=
              side==="a"
              ? `previewA${index}`
              : `previewB${index}`;


            document.getElementById(id)
              .innerHTML=
              `<img src="${e.target.result}" alt="">`;

          };


          reader.readAsDataURL(file);

        }
      );

    });

}


/* =====================================
   枚数
===================================== */

document
  .querySelectorAll(".count-btn")
  .forEach(btn=>{

    btn.addEventListener(
      "click",
      function(){

        document
          .querySelectorAll(".count-btn")
          .forEach(b=>{
            b.classList.remove("selected");
          });


        this.classList.add("selected");


        cardCount=
          Number(this.dataset.count);


        createPairSettings();

      }
    );

  });


/* =====================================
   完成画像
===================================== */

document
  .getElementById("completeInput")
  .addEventListener(
    "change",
    function(){

      const file=this.files[0];

      if(!file)return;


      const reader=
        new FileReader();


      reader.onload=function(e){

        completeImageData=
          e.target.result;


        document.getElementById(
          "completePreview"
        ).innerHTML=
          `<img src="${completeImageData}" alt="">`;

      };


      reader.readAsDataURL(file);

    }
  );


/* =====================================
   保存
===================================== */

function saveSettings(){

  const count=
    cardCount/2;


  for(
    let i=0;
    i<count;
    i++
  ){

    const a=
      document.getElementById(`pairA${i}`);

    const b=
      document.getElementById(`pairB${i}`);


    if(a){
      pairs[i][0]=a.value.trim();
    }


    if(b){
      pairs[i][1]=b.value.trim();
    }

  }


  for(
    let i=0;
    i<4;
    i++
  ){

    gifts[i].name=
      document.getElementById(
        `giftName${i}`
      ).value.trim() || "ギフト";


    gifts[i].count=
      Math.max(
        2,
        Number(
          document.getElementById(
            `giftCount${i}`
          ).value
        )||2
      );

  }


  updateGiftButtons();

  closeSettings();

  startGame();

}


/* =====================================
   ギフト名表示
===================================== */

function updateGiftButtons(){

  document
    .querySelectorAll(".gift-btn")
    .forEach((btn,index)=>{

      btn.textContent=
        gifts[index].name;

    });

}


/* =====================================
   カード作成
===================================== */

function createCards(){

  const board=
    document.getElementById("board");

  board.innerHTML="";

  board.className=
    "c"+cardCount;


  const data=[];


  for(
    let i=0;
    i<cardCount/2;
    i++
  ){

    const pair=
      pairs[i]||["",""];


    const images=
      pairImages[i]||{
        a:null,
        b:null
      };


    data.push({
      pairId:i,
      text:pair[0],
      image:images.a
    });


    data.push({
      pairId:i,
      text:pair[1],
      image:images.b
    });

  }


  shuffle(data);


  data.forEach((item,index)=>{

    const card=
      document.createElement("div");

    card.className="card";

    card.dataset.index=index;

    card.dataset.pairId=
      item.pairId;


    let front;


    if(item.image){

      front=
        `<img src="${item.image}" alt="">`;

    }else{

      front=
        `<div class="card-text">
          ${esc(item.text)}
        </div>`;

    }


    card.innerHTML=`

      <div class="card-inner">

        <div class="card-back">

          <div class="card-back-number">
            ${index+1}
          </div>

        </div>

        <div class="card-front">
          ${front}
        </div>

      </div>
    `;


    card.addEventListener(
      "click",
      function(){
        selectCard(card);
      }
    );


    board.appendChild(card);

  });

}


/* =====================================
   カード選択
===================================== */

function selectCard(card){

  if(lockBoard)return;


  if(
    card.classList.contains("matched") ||
    card.classList.contains("flipped")
  ){
    return;
  }


  if(
    selectedGift!==null &&
    candidateIndexes.length>0
  ){

    const index=
      Number(card.dataset.index);


    if(
      !candidateIndexes.includes(index)
    ){

      document.getElementById(
        "message"
      ).textContent=
        "候補のカードから選んでね！";

      return;

    }

  }


  card.classList.add("flipped");


  if(!firstCard){

    firstCard=card;

    document.getElementById(
      "statusMain"
    ).textContent=
      "もう1枚選んでね！";

    return;

  }


  secondCard=card;

  clearCandidates();

  checkMatch();

}


/* =====================================
   判定
===================================== */

function checkMatch(){

  const a=
    Number(firstCard.dataset.pairId);

  const b=
    Number(secondCard.dataset.pairId);


  if(a===b){

    firstCard.classList.add("matched");

    secondCard.classList.add("matched");


    matchedPairs++;


    firstCard=null;
    secondCard=null;


    updateStatus();


    document.getElementById(
      "statusMain"
    ).textContent=
      "ペア成立！";


    if(
      matchedPairs>=cardCount/2
    ){

      setTimeout(
        showComplete,
        600
      );

    }

  }else{

    lockBoard=true;


    document.getElementById(
      "statusMain"
    ).textContent=
      "残念！";


    setTimeout(function(){

      firstCard.classList.remove(
        "flipped"
      );

      secondCard.classList.remove(
        "flipped"
      );


      firstCard=null;
      secondCard=null;

      lockBoard=false;


      document.getElementById(
        "statusMain"
      ).textContent=
        "もう一度選んでね！";

    },850);

  }

}


/* =====================================
   ★ ギフト候補
===================================== */

function activateGift(giftIndex){

  if(lockBoard)return;


  selectedGift=
    giftIndex;


  document
    .querySelectorAll(".gift-btn")
    .forEach(btn=>{
      btn.classList.remove("active");
    });


  const active=
    document.querySelector(
      `.gift-btn[data-gift="${giftIndex}"]`
    );


  if(active){
    active.classList.add("active");
  }


  const cards=
    Array.from(
      document.querySelectorAll(".card")
    );


  const available=
    cards
      .map((card,index)=>({
        card,
        index,
        pairId:Number(
          card.dataset.pairId
        )
      }))
      .filter(item=>
        !item.card.classList.contains("matched") &&
        !item.card.classList.contains("flipped")
      );


  if(available.length<2)return;


  let candidateCount=
    Math.max(
      2,
      Number(
        gifts[giftIndex].count
      )||2
    );


  candidateCount=
    Math.min(
      candidateCount,
      available.length
    );


  /*
     ペアを探す
  */

  const map={};


  available.forEach(item=>{

    if(!map[item.pairId]){
      map[item.pairId]=[];
    }

    map[item.pairId].push(item);

  });


  const possiblePairs=
    Object.values(map)
      .filter(pair=>pair.length>=2);


  let selected=[];


  /*
     必ず最初に1ペア入れる
  */

  if(possiblePairs.length){

    const pair=
      possiblePairs[
        Math.floor(
          Math.random()*
          possiblePairs.length
        )
      ];


    selected.push(pair[0]);
    selected.push(pair[1]);

  }


  /*
     残りをランダム追加
  */

  const used=
    new Set(
      selected.map(
        x=>x.index
      )
    );


  let remaining=
    available.filter(
      x=>!used.has(x.index)
    );


  shuffle(remaining);


  while(
    selected.length<candidateCount &&
    remaining.length
  ){

    selected.push(
      remaining.shift()
    );

  }


  shuffle(selected);


  candidateIndexes=
    selected.map(
      x=>x.index
    );


  showCandidates();


  document.getElementById(
    "statusMain"
  ).textContent=
    "候補から2枚選んでね！";


  document.getElementById(
    "message"
  ).textContent=
    gifts[giftIndex].name+
    "：候補が表示されました！";

}


/* =====================================
   ★ 候補表示
===================================== */

function showCandidates(){

  const area=
    document.getElementById(
      "candidateArea"
    );


  const list=
    document.getElementById(
      "candidates"
    );


  list.innerHTML="";


  /*
     枚数クラスを付ける
     → 2/4/6/8枚を自動配置
  */

  list.className=
    "candidates c"+
    candidateIndexes.length;


  candidateIndexes.forEach(index=>{

    const button=
      document.createElement("div");


    button.className="candidate";

    button.textContent=
      index+1;


    button.addEventListener(
      "click",
      function(){

        const cards=
          document.querySelectorAll(
            ".card"
          );


        if(cards[index]){
          selectCard(cards[index]);
        }

      }
    );


    list.appendChild(button);

  });


  area.style.display="flex";

}


/* =====================================
   候補消去
===================================== */

function clearCandidates(){

  candidateIndexes=[];

  selectedGift=null;


  document.getElementById(
    "candidateArea"
  ).style.display="none";


  document
    .querySelectorAll(".gift-btn")
    .forEach(btn=>{
      btn.classList.remove("active");
    });

}


/* =====================================
   状態
===================================== */

function updateStatus(){

  document.getElementById(
    "statusSub"
  ).textContent=
    "ペア "+
    matchedPairs+
    " / "+
    cardCount/2;

}


/* =====================================
   開始
===================================== */

function startGame(){

  matchedPairs=0;

  firstCard=null;
  secondCard=null;

  lockBoard=false;

  clearCandidates();

  createCards();

  updateStatus();


  document.getElementById(
    "statusMain"
  ).textContent=
    "ギフトを選んでね！";


  document.getElementById(
    "message"
  ).textContent=
    "指定ギフトで候補を絞れます！";

}


/* =====================================
   完成
===================================== */

function showComplete(){

  const screen=
    document.getElementById(
      "completeScreen"
    );

  const image=
    document.getElementById(
      "completeImage"
    );


  if(completeImageData){

    image.src=
      completeImageData;

    image.style.display="block";

  }else{

    image.style.display="none";

  }


  screen.classList.add("show");

}


/* =====================================
   ボタン
===================================== */

document
  .getElementById("settingBtn")
  .addEventListener(
    "click",
    openSettings
  );


document
  .getElementById("closeBtn")
  .addEventListener(
    "click",
    closeSettings
  );


document
  .getElementById("saveBtn")
  .addEventListener(
    "click",
    saveSettings
  );


document
  .getElementById("startBtn")
  .addEventListener(
    "click",
    startGame
  );


document
  .getElementById("resetBtn")
  .addEventListener(
    "click",
    startGame
  );


document
  .getElementById("completeClose")
  .addEventListener(
    "click",
    function(){

      document
        .getElementById(
          "completeScreen"
        )
        .classList.remove("show");

      startGame();

    }
  );


document
  .querySelectorAll(".gift-btn")
  .forEach(btn=>{

    btn.addEventListener(
      "click",
      function(){

        activateGift(
          Number(
            this.dataset.gift
          )
        );

      }
    );

  });


/* =====================================
   初期化
===================================== */

updateGiftButtons();

createPairSettings();

startGame();

</script>
