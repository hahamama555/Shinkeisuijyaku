<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>ギフト神経衰弱</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#111;
  color:#fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Yu Gothic",
    sans-serif;
}

body{
  overflow:hidden;
}

button,
input{
  font:inherit;
}

/* =================================
   9:16 メイン
================================= */

.app{
  width:100vw;
  height:100vh;
  max-width:600px;
  aspect-ratio:9 / 16;
  margin:auto;
  background:#111;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* =================================
   ヘッダー
================================= */

.header{
  flex:0 0 auto;
  padding:
    clamp(5px,1.2vh,12px)
    clamp(7px,2vw,14px)
    clamp(4px,1vh,8px);
  text-align:center;
}

.title{
  font-size:clamp(18px,5vw,30px);
  font-weight:900;
  line-height:1.15;
}

.message{
  margin-top:3px;
  font-size:clamp(10px,2.7vw,15px);
  color:#ddd;
}

/* =================================
   ステータス
================================= */

.status{
  flex:0 0 auto;
  margin:0 8px 5px;
  padding:5px;
  background:#202020;
  border-radius:8px;
  text-align:center;
}

.status-main{
  font-size:clamp(12px,3.3vw,18px);
  font-weight:bold;
}

.status-sub{
  font-size:clamp(9px,2.3vw,13px);
  color:#aaa;
}

/* =================================
   候補表示
================================= */

.candidate-area{
  flex:0 0 auto;
  min-height:0;
  margin:0 8px 5px;
  display:none;
}

.candidate-title{
  text-align:center;
  font-size:clamp(10px,2.5vw,14px);
  color:#ffd400;
  margin-bottom:4px;
}

.candidates{
  display:flex;
  justify-content:center;
  gap:5px;
  overflow:hidden;
}

.candidate{
  width:clamp(38px,10vw,65px);
  aspect-ratio:1/1;
  background:#333;
  border:2px solid #ffd400;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(9px,2.5vw,15px);
  font-weight:bold;
  cursor:pointer;
  overflow:hidden;
}

.candidate img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* =================================
   ゲーム盤
================================= */

.board-wrap{
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:
    0
    clamp(5px,1.5vw,10px);
}

.board{
  width:100%;
  max-height:100%;
  display:grid;
  gap:clamp(2px,0.9vw,6px);
}

/* 枚数 */

.board.c16{
  grid-template-columns:repeat(4,1fr);
}

.board.c24{
  grid-template-columns:repeat(6,1fr);
}

.board.c36{
  grid-template-columns:repeat(6,1fr);
}

.board.c48{
  grid-template-columns:repeat(8,1fr);
}

/* =================================
   カード
================================= */

.card{
  aspect-ratio:1/1;
  perspective:800px;
  cursor:pointer;
  min-width:0;
}

.card-inner{
  width:100%;
  height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:
    transform .32s ease;
}

.card.flipped .card-inner,
.card.matched .card-inner{
  transform:rotateY(180deg);
}

.card-front,
.card-back{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  border-radius:clamp(4px,1.3vw,9px);
  overflow:hidden;
}

/* 裏面 */

.card-back{
  background:
    linear-gradient(
      135deg,
      #5143c9,
      #ad2fd0
    );
  border:
    clamp(1px,0.5vw,2px)
    solid #fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card-number{
  font-size:clamp(10px,3.2vw,23px);
  font-weight:900;
  text-shadow:0 2px 3px #000;
}

/* 表面 */

.card-front{
  transform:rotateY(180deg);
  background:#fff;
  color:#111;
  border:
    clamp(1px,0.5vw,2px)
    solid #fff;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:3px;
}

.card-front img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.card-text{
  font-size:clamp(9px,3vw,22px);
  font-weight:900;
  line-height:1.15;
  word-break:break-word;
}

.card.matched .card-front{
  border-color:#ffd400;
  box-shadow:
    0 0 8px
    rgba(255,212,0,.9);
}

/* =================================
   下部操作
================================= */

.bottom{
  flex:0 0 auto;
  padding:
    4px
    8px
    max(6px,env(safe-area-inset-bottom));
}

/* ギフトボタン */

.gifts{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
}

.gift-btn{
  border:0;
  border-radius:7px;
  padding:6px 2px;
  background:#333;
  color:#fff;
  font-size:clamp(9px,2.5vw,14px);
  font-weight:bold;
}

.gift-btn.active{
  background:#ffd400;
  color:#111;
}

/* ゲーム操作 */

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  margin-top:5px;
}

.control{
  border:0;
  border-radius:7px;
  padding:7px;
  font-weight:bold;
  font-size:clamp(10px,2.8vw,15px);
}

.start{
  background:#ffd400;
  color:#111;
}

.reset{
  background:#444;
  color:#fff;
}

/* =================================
   設定画面
================================= */

.settings{
  position:fixed;
  inset:0;
  background:#111;
  z-index:100;
  overflow-y:auto;
  display:none;
  padding:12px;
}

.settings.show{
  display:block;
}

.settings-box{
  width:100%;
  max-width:600px;
  margin:auto;
}

.settings-title{
  text-align:center;
  font-size:22px;
  font-weight:900;
  margin-bottom:12px;
}

.section{
  background:#222;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}

.section h3{
  font-size:15px;
  margin:0 0 8px;
  text-align:center;
}

/* 枚数 */

.counts{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
}

.count{
  border:0;
  background:#444;
  color:#fff;
  border-radius:7px;
  padding:8px 2px;
  font-weight:bold;
}

.count.selected{
  background:#ffd400;
  color:#111;
}

/* ペア */

.pair{
  display:grid;
  grid-template-columns:25px 1fr 1fr;
  gap:5px;
  margin-bottom:6px;
  align-items:center;
}

.pair-no{
  text-align:center;
  color:#ffd400;
  font-weight:bold;
}

.pair input{
  width:100%;
  min-width:0;
  padding:7px;
  border:1px solid #555;
  border-radius:6px;
  background:#333;
  color:#fff;
}

.pair-file{
  display:block;
  background:#444;
  border-radius:6px;
  padding:6px;
  text-align:center;
  font-size:11px;
}

.pair-file input{
  display:none;
}

/* ギフト設定 */

.gift-setting{
  display:grid;
  grid-template-columns:80px 1fr;
  gap:6px;
  align-items:center;
  margin-bottom:6px;
}

.gift-setting input{
  width:100%;
  background:#333;
  border:1px solid #555;
  border-radius:6px;
  padding:7px;
  color:#fff;
}

.save{
  width:100%;
  border:0;
  border-radius:8px;
  background:#ffd400;
  color:#111;
  padding:11px;
  font-weight:bold;
}

.close-settings{
  width:100%;
  border:0;
  border-radius:8px;
  background:#444;
  color:#fff;
  padding:10px;
  margin-top:7px;
}

/* =================================
   完成
================================= */

.complete{
  position:fixed;
  inset:0;
  z-index:200;
  background:rgba(0,0,0,.96);
  display:none;
  align-items:center;
  justify-content:center;
  padding:12px;
}

.complete.show{
  display:flex;
}

.complete-box{
  width:100%;
  max-width:600px;
  text-align:center;
}

.complete-title{
  font-size:clamp(25px,8vw,45px);
  font-weight:900;
  color:#ffd400;
  margin-bottom:10px;
}

.complete-image{
  width:100%;
  max-height:75vh;
  object-fit:contain;
  border-radius:10px;
  border:3px solid #fff;
}

.complete-close{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:0;
  border-radius:8px;
  font-weight:bold;
}


/* =================================
   小さい画面調整
================================= */

@media(max-height:700px){

  .header{
    padding-top:4px;
    padding-bottom:2px;
  }

  .bottom{
    padding-top:2px;
  }

  .gift-btn{
    padding:4px 2px;
  }

  .control{
    padding:5px;
  }

}

</style>
</head>


<body>

<div class="app">

  <!-- ヘッダー -->

  <div class="header">

    <div class="title">
      🎴 ギフト神経衰弱
    </div>

    <div class="message"
         id="message">
      ギフトを選んでカードをめくろう！
    </div>

  </div>


  <!-- ステータス -->

  <div class="status">

    <div class="status-main"
         id="statusMain">
      ゲーム開始を押してね！
    </div>

    <div class="status-sub"
         id="statusSub">
      ペア 0 / 8
    </div>

  </div>


  <!-- 候補カード -->

  <div class="candidate-area"
       id="candidateArea">

    <div class="candidate-title"
         id="candidateTitle">
      候補の中からカードを選んでください
    </div>

    <div class="candidates"
         id="candidates">
    </div>

  </div>


  <!-- ゲーム -->

  <div class="board-wrap">

    <div id="board"
         class="board c16">
    </div>

  </div>


  <!-- 下部 -->

  <div class="bottom">

    <!-- ギフト選択 -->

    <div class="gifts">

      <button class="gift-btn"
              data-gift="0">
        ❤️ ハートミー
      </button>

      <button class="gift-btn"
              data-gift="1">
        🍩 ドーナツ
      </button>

      <button class="gift-btn"
              data-gift="2">
        🎁 ギフトA
      </button>

      <button class="gift-btn"
              data-gift="3">
        ⭐ 特別ギフト
      </button>

    </div>


    <div class="controls">

      <button class="control start"
              onclick="startGame()">
        🎮 ゲーム開始
      </button>

      <button class="control reset"
              onclick="resetGame()">
        🔄 リセット
      </button>

    </div>

  </div>

</div>


<!-- =================================
設定画面
================================= -->

<div class="settings"
     id="settings">

  <div class="settings-box">

    <div class="settings-title">
      ⚙️ ゲーム設定
    </div>


    <!-- 枚数 -->

    <div class="section">

      <h3>🎴 カード枚数</h3>

      <div class="counts">

        <button class="count selected"
                data-count="16">
          16枚
        </button>

        <button class="count"
                data-count="24">
          24枚
        </button>

        <button class="count"
                data-count="36">
          36枚
        </button>

        <button class="count"
                data-count="48">
          48枚
        </button>

      </div>

    </div>


    <!-- ペア -->

    <div class="section">

      <h3>
        🔗 ペア設定
      </h3>

      <div id="pairList"></div>

    </div>


    <!-- ギフト -->

    <div class="section">

      <h3>
        🎁 ギフトごとの候補数
      </h3>

      <div class="gift-setting">

        <div>❤️ ハートミー</div>

        <input id="gift0"
               type="number"
               min="2"
               value="4">

      </div>

      <div class="gift-setting">

        <div>🍩 ドーナツ</div>

        <input id="gift1"
               type="number"
               min="2"
               value="6">

      </div>

      <div class="gift-setting">

        <div>🎁 ギフトA</div>

        <input id="gift2"
               type="number"
               min="2"
               value="8">

      </div>

      <div class="gift-setting">

        <div>⭐ 特別ギフト</div>

        <input id="gift3"
               type="number"
               min="2"
               value="12">

      </div>

    </div>


    <button class="save"
            onclick="saveSettings()">
      💾 設定を保存
    </button>

    <button class="close-settings"
            onclick="closeSettings()">
      閉じる
    </button>

  </div>

</div>


<!-- =================================
完成画面
================================= -->

<div class="complete"
     id="complete">

  <div class="complete-box">

    <div class="complete-title">
      🎉 完成！ 🎉
    </div>

    <img id="completeImage"
         class="complete-image">

    <button class="complete-close"
            onclick="closeComplete()">
      もう一度ゲームする
    </button>

  </div>

</div>


<script>

/* ==========================================
   設定
========================================== */

let cardCount = 16;

let pairs = [

  {
    a:"京都",
    b:"八ツ橋",

    imageB:null
  },

  {

  },

  {

    imageA:null,
    imageB:null
  },

  {
    a:"福岡",
    b:"明太子",
    imageA:null,
    imageB:null
  },

  {
    a:"奈良",
    b:"鹿",
    imageA:null,
    imageB:null
  },

  {
    a:"神奈川",
    b:"横浜",
    imageA:null,
    imageB:null
  },

  {
    a:"愛知",
    b:"味噌カツ",
    imageA:null,
    imageB:null
  },

  {
    a:"広島",
    b:"お好み焼き",
    imageA:null,
    imageB:null
  },

  {
    a:"宮城",
    b:"牛タン",
    imageA:null,
    imageB:null
  },

  {
    a:"長野",
    b:"そば",
    imageA:null,
    imageB:null
  },

  {
    a:"兵庫",
    b:"神戸牛",
    imageA:null,
    imageB:null
  },

  {
    a:"香川",
    b:"うどん",
    imageA:null,
    imageB:null
  },

  {
    a:"静岡",
    b:"富士山",
    imageA:null,
    imageB:null
  },

  {
    a:"青森",
    b:"りんご",
    imageA:null,
    imageB:null
  },

  {
    a:"千葉",
    b:"落花生",
    imageA:null,
    imageB:null
  },

  {
    a:"熊本",
    b:"くまモン",
    imageA:null,
    imageB:null
  },

  {
    a:"栃木",
    b:"餃子",
    imageA:null,
    imageB:null
  },

  {
    a:"群馬",
    b:"温泉",
    imageA:null,
    imageB:null
  },

  {
    a:"石川",
    b:"金沢",
    imageA:null,
    imageB:null
  },

  {
    a:"山梨",
    b:"ぶどう",
    imageA:null,
    imageB:null
  },

  {
    a:"秋田",
    b:"きりたんぽ",
    imageA:null,
    imageB:null
  },

  {
    a:"鹿児島",
    b:"黒豚",
    imageA:null,
    imageB:null
  }

];


/* ==========================================
   ゲーム状態
========================================== */

let cards = [];

let firstCard = null;

let secondCard = null;

let lockBoard = false;

let matchedPairs = 0;

let selectedGift = null;

let candidateIndexes = [];


/* ギフトごとの候補数 */

let giftCandidateCount = [
  4,
  6,
  8,
  12
];


/* ==========================================
   完成画像
========================================== */

let completeImage =
  "https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=1200&q=90";


/* ==========================================
   初期化
========================================== */

createPairInputs();

createCards();

updateStatus();


/* ==========================================
   ペア設定欄
========================================== */

function createPairInputs(){

  const list =
    document.getElementById("pairList");

  list.innerHTML = "";

  const count =
    cardCount / 2;

  for(let i=0;i<count;i++){

    if(!pairs[i]){

      pairs[i] = {
        a:"",
        b:"",
        imageA:null,
        imageB:null
      };

    }

    const row =
      document.createElement("div");

    row.className="pair";

    row.innerHTML = `

      <div class="pair-no">
        ${i+1}
      </div>

      <input
        id="pairA-${i}"
        value="${escapeAttr(pairs[i].a)}"
        placeholder="1枚目">

      <input
        id="pairB-${i}"
        value="${escapeAttr(pairs[i].b)}"
        placeholder="2枚目">

    `;

    list.appendChild(row);

  }

}


/* ==========================================
   設定保存
========================================== */

function saveSettings(){

  const count =
    cardCount / 2;

  for(let i=0;i<count;i++){

    const a =
      document.getElementById(
        "pairA-"+i
      );

    const b =
      document.getElementById(
        "pairB-"+i
      );

    pairs[i].a =
      a ? a.value.trim() : "";

    pairs[i].b =
      b ? b.value.trim() : "";

  }


  giftCandidateCount[0] =
    Number(
      document.getElementById("gift0").value
    ) || 4;

  giftCandidateCount[1] =
    Number(
      document.getElementById("gift1").value
    ) || 6;

  giftCandidateCount[2] =
    Number(
      document.getElementById("gift2").value
    ) || 8;

  giftCandidateCount[3] =
    Number(
      document.getElementById("gift3").value
    ) || 12;


  document
    .getElementById("settings")
    .classList.remove("show");

  startGame();

}


/* ==========================================
   設定画面を開く方法
   長押しでも使えるようにする
========================================== */

document
  .querySelector(".title")
  .addEventListener("dblclick",()=>{

    document
      .getElementById("settings")
      .classList.add("show");

  });


/* ==========================================
   閉じる
========================================== */

function closeSettings(){

  document
    .getElementById("settings")
    .classList.remove("show");

}


/* ==========================================
   枚数変更
========================================== */

document
  .querySelectorAll(".count")
  .forEach(btn=>{

    btn.addEventListener("click",()=>{

      document
        .querySelectorAll(".count")
        .forEach(b=>{
          b.classList.remove("selected");
        });

      btn.classList.add("selected");

      cardCount =
        Number(btn.dataset.count);

      createPairInputs();

      resetGame();

    });

  });


/* ==========================================
   シャッフル
========================================== */

function shuffle(array){

  for(
    let i=array.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );

    [
      array[i],
      array[j]
    ]=[
      array[j],
      array[i]
    ];

  }

}


/* ==========================================
   カード作成
========================================== */

function createCards(){

  const board =
    document.getElementById("board");

  board.innerHTML = "";

  board.className =
    "board c"+cardCount;

  cards=[];

  const pairCount =
    cardCount/2;


  /*
    重要：
    1ペアにつき
    AとBを1枚ずつ作る
  */

  for(let i=0;i<pairCount;i++){

    cards.push({

      pairId:i,

      side:"A",

      text:pairs[i].a,

      image:pairs[i].imageA

    });


    cards.push({

      pairId:i,

      side:"B",

      text:pairs[i].b,

      image:pairs[i].imageB

    });

  }


  shuffle(cards);


  cards.forEach((data,index)=>{

    const card =
      document.createElement("div");

    card.className="card";

    card.dataset.index=index;

    card.dataset.pairId=
      data.pairId;

    let frontHTML="";


    if(data.image){

      frontHTML = `
        <img src="${data.image}">
      `;

    }else{

      frontHTML = `
        <div class="card-text">
          ${escapeHTML(
            data.text || "？"
          )}
        </div>
      `;

    }


    card.innerHTML = `

      <div class="card-inner">

        <div class="card-back">

          <div class="card-number">
            ${index+1}
          </div>

        </div>

        <div class="card-front">

          ${frontHTML}

        </div>

      </div>

    `;


    card.addEventListener(
      "click",
      ()=>{
        selectCard(card);
      }
    );


    board.appendChild(card);

  });

}


/* ==========================================
   カード選択
========================================== */

function selectCard(card){

  if(lockBoard)return;

  if(
    card.classList.contains("matched")
  )return;

  if(
    card.classList.contains("flipped")
  )return;


  /*
    ギフトが選択されている場合、
    候補カード以外は選択できない
  */

  if(
    selectedGift !== null &&
    candidateIndexes.length > 0
  ){

    const index =
      Number(card.dataset.index);

    if(
      !candidateIndexes.includes(index)
    ){

      document.getElementById(
        "message"
      ).textContent =
        "黄色の候補カードから選んでね！";

      return;

    }

  }


  card.classList.add("flipped");


  if(!firstCard){

    firstCard=card;

    document.getElementById(
      "statusMain"
    ).textContent =
      "もう1枚選んでね！";

    return;

  }


  secondCard=card;

  checkMatch();

}


/* ==========================================
   判定
========================================== */

function checkMatch(){

  const a =
    Number(firstCard.dataset.pairId);

  const b =
    Number(secondCard.dataset.pairId);


  if(a===b){

    firstCard.classList.add("matched");

    secondCard.classList.add("matched");

    matchedPairs++;

    updateStatus();

    firstCard=null;

    secondCard=null;

    clearCandidates();


    if(
      matchedPairs === cardCount/2
    ){

      setTimeout(
        showComplete,
        500
      );

    }else{

      document.getElementById(
        "statusMain"
      ).textContent =
        "ペア成立！次のギフトを選んでね";

    }

  }else{

    lockBoard=true;

    setTimeout(()=>{

      firstCard.classList.remove(
        "flipped"
      );

      secondCard.classList.remove(
        "flipped"
      );

      firstCard=null;

      secondCard=null;

      lockBoard=false;

      document.getElementById(
        "statusMain"
      ).textContent =
        "残念！もう一度選んでね";

    },800);

  }

}


/* ==========================================
   ギフトボタン
========================================== */

document
  .querySelectorAll(".gift-btn")
  .forEach(btn=>{

    btn.addEventListener("click",()=>{

      const gift =
        Number(btn.dataset.gift);

      activateGift(gift);

    });

  });


/* ==========================================
   ギフト発動
========================================== */

function activateGift(gift){

  selectedGift=gift;

  const count =
    giftCandidateCount[gift];


  document
    .querySelectorAll(".gift-btn")
    .forEach(btn=>{
      btn.classList.remove("active");
    });


  document
    .querySelector(
      '.gift-btn[data-gift="'+gift+'"]'
    )
    .classList.add("active");


  /*
    裏向きで、
    まだペア成立していない
    カードだけから候補を作る
  */

  const available=[];

  document
    .querySelectorAll(".card")
    .forEach((card,index)=>{

      if(
        !card.classList.contains("matched") &&
        !card.classList.contains("flipped")
      ){

        available.push(index);

      }

    });


  shuffle(available);


  candidateIndexes =
    available.slice(
      0,
      Math.min(count,available.length)
    );


  showCandidates();


  document.getElementById(
    "statusMain"
  ).textContent =
    "候補カードから2枚選んでね！";

  document.getElementById(
    "message"
  ).textContent =
    "指定ギフトの候補を絞りました！";

}


/* ==========================================
   候補表示
========================================== */

function showCandidates(){

  const area =
    document.getElementById(
      "candidateArea"
    );

  const container =
    document.getElementById(
      "candidates"
    );

  container.innerHTML="";

  candidateIndexes
    .forEach(index=>{

      const card =
        document.querySelectorAll(
          ".card"
        )[index];

      if(!card)return;


      const candidate =
        document.createElement("div");

      candidate.className=
        "candidate";


      const number =
        index+1;


      candidate.textContent =
        number;


      candidate.addEventListener(
        "click",
        ()=>{
          selectCard(card);
        }
      );


      container.appendChild(
        candidate
      );

    });


  area.style.display="block";

}


/* ==========================================
   候補解除
========================================== */

function clearCandidates(){

  candidateIndexes=[];

  selectedGift=null;

  document.getElementById(
    "candidateArea"
  ).style.display="none";

  document
    .querySelectorAll(".gift-btn")
    .forEach(btn=>{
      btn.classList.remove("active");
    });

}


/* ==========================================
   ステータス
========================================== */

function updateStatus(){

  document.getElementById(
    "statusSub"
  ).textContent =
    "ペア "+
    matchedPairs+
    " / "+
    (cardCount/2);

}


/* ==========================================
   ゲーム開始
========================================== */

function startGame(){

  matchedPairs=0;

  firstCard=null;

  secondCard=null;

  lockBoard=false;

  clearCandidates();

  createCards();

  updateStatus();

  document.getElementById(
    "statusMain"
  ).textContent =
    "ギフトを選んでね！";

  document.getElementById(
    "message"
  ).textContent =
    "ギフトを受け取ったら候補を絞れます！";

}


/* ==========================================
   リセット
========================================== */

function resetGame(){

  startGame();

}


/* ==========================================
   完成
========================================== */

function showComplete(){

  document.getElementById(
    "completeImage"
  ).src =
    completeImage;

  document.getElementById(
    "complete"
  ).classList.add("show");

}


/* ==========================================
   完成画面を閉じる
========================================== */

function closeComplete(){

  document.getElementById(
    "complete"
  ).classList.remove("show");

  startGame();

}


/* ==========================================
   エスケープ
========================================== */

function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent=text;

  return div.innerHTML;

}

function escapeAttr(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}
