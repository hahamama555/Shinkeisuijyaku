  align-items:center;
  justify-content:center;

  overflow:hidden;
}

/* ==================================================
   BOARD
================================================== */

#board{
  width:100%;
  height:100%;

  display:grid;

  align-content:center;
  justify-content:center;

  min-height:0;
  min-width:0;
}

/* 16 */
#board.c16{
  grid-template-columns:repeat(4,1fr);
  gap:1.2%;
}

/* 24 */
#board.c24{
  grid-template-columns:repeat(6,1fr);
  gap:0.9%;
}

/* 36 */
#board.c36{
  grid-template-columns:repeat(6,1fr);
  gap:0.75%;
}

/* 48 */
#board.c48{
  grid-template-columns:repeat(8,1fr);
  gap:0.65%;
}

/* ==================================================
   CARD
================================================== */

.card{
  width:100%;
  aspect-ratio:1/1;

  perspective:800px;

  cursor:pointer;

  min-width:0;
  min-height:0;
}

.card-inner{
  width:100%;
  height:100%;

  position:relative;

  transform-style:preserve-3d;

  transition:
    transform .32s ease;
}

.card.flipped .card-inner,
.card.matched .card-inner{
  transform:rotateY(180deg);
}

/* ==================================================
   CARD FRONT / BACK
================================================== */

.card-front,
.card-back{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  border-radius:8%;

  backface-visibility:hidden;

  overflow:hidden;
}

/* BACK */

.card-back{
  background:
    linear-gradient(
      135deg,
      #4937c8,
      #a52bc7
    );

  border:2px solid #fff;

  display:flex;
  align-items:center;
  justify-content:center;
}

.card-number{
  font-size:5%;
  font-weight:900;

  color:#fff;

  text-shadow:
    0 2px 3px #000;
}

/* FRONT */

.card-front{
  transform:rotateY(180deg);

  background:#fff;

  border:2px solid #fff;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}

.card-front img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}

.card-text{
  width:100%;

  padding:4%;

  font-size:6%;

  line-height:1.1;

}

.card.matched .card-front{

================================================== */

function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent =
    text || "";

  return div.innerHTML;

}


function escapeAttr(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}

  for(
    let i=0;
    i<pairCount;
    i++
  ){

    if(!pairs[i]){

      pairs[i] = {
        name:"",
        a:"",
        b:"",
        imageA:null,
        imageB:null
      };

    }


    const p = pairs[i];


    const box =
      document.createElement("div");

    box.className =
      "pair-box";


    box.innerHTML = `

      <div class="pair-header">
        ペア ${i+1}
      </div>

      <input
        class="pair-name"
        id="pair-name-${i}"
        value="${escapeAttr(p.name)}"
        placeholder="ペア名（例：京都名物）">

      <div class="card-settings">

        <div class="card-setting">

          <div class="card-label">
            カード①
          </div>

          <input
            class="card-text-input"
            id="text-a-${i}"
            type="text"
            value="${escapeAttr(p.a)}"
            placeholder="京都">

          <div
            class="preview"
            id="preview-a-${i}">
          </div>

          <label class="image-label">

            📷 画像を選択

            <input
              class="image-input"
              type="file"
              accept="image/*"
              data-index="${i}"
              data-side="a">

          </label>

        </div>


        <div class="card-setting">

          <div class="card-label">
            カード②
          </div>

          <input
            class="card-text-input"
            id="text-b-${i}"
            type="text"
            value="${escapeAttr(p.b)}"
            placeholder="八ツ橋">

          <div
            class="preview"
            id="preview-b-${i}">
          </div>

          <label class="image-label">

            📷 画像を選択

            <input
              class="image-input"
              type="file"
              accept="image/*"
              data-index="${i}"
              data-side="b">

          </label>

        </div>

      </div>
    `;


    list.appendChild(box);


    updatePreview(i,"a");

    updatePreview(i,"b");

  }


  document
    .querySelectorAll(".image-input")
    .forEach(input=>{

      input.addEventListener(
        "change",
        function(){

          const index =
            Number(this.dataset.index);

          const side =
            this.dataset.side;

          const file =
            this.files[0];

          if(!file)return;


          const reader =
            new FileReader();


          reader.onload =
            function(e){

              if(side === "a"){

                pairs[index].imageA =
                  e.target.result;

              }else{

                pairs[index].imageB =
                  e.target.result;

              }


              updatePreview(
                index,
                side
              );

            };


          reader.readAsDataURL(file);

        }
      );

    });

}


/* ==================================================
   PREVIEW
================================================== */

function updatePreview(
  index,
  side
){

  const preview =
    document.getElementById(
      `preview-${side}-${index}`
    );

  if(!preview)return;


  const image =
    side === "a"
      ? pairs[index].imageA
      : pairs[index].imageB;


  const text =
    side === "a"
      ? pairs[index].a
      : pairs[index].b;


  if(image){

    preview.innerHTML =
      `<img src="${image}" alt="">`;

  }else{

    preview.textContent =
      text || "画像なし";

  }

}


/* ==================================================
   COUNT BUTTONS
================================================== */

document
  .querySelectorAll(".count-btn")
  .forEach(btn=>{

    btn.addEventListener(
      "click",
      ()=>{

        document
          .querySelectorAll(".count-btn")
          .forEach(b=>{
            b.classList.remove(
              "selected"
            );
          });


        btn.classList.add(
          "selected"
        );


        cardCount =
          Number(btn.dataset.count);


        createPairInputs();

      }
    );

  });


/* ==================================================
   COMPLETE IMAGE
================================================== */

document
  .getElementById("completeInput")
  .addEventListener(
    "change",
    function(){

      const file =
        this.files[0];

      if(!file)return;


      const reader =
        new FileReader();


      reader.onload =
        function(e){

          completeImageData =
            e.target.result;


          document
            .getElementById(
              "completePreview"
            )
            .innerHTML =
            `<img src="${completeImageData}"
                  alt="">`;

        };


      reader.readAsDataURL(file);

    }
  );


/* ==================================================
   SAVE SETTINGS
================================================== */

function saveSettings(){

  const count =
    cardCount / 2;


  for(
    let i=0;
    i<count;
    i++
  ){

    pairs[i].name =
      document
        .getElementById(
          `pair-name-${i}`
        )
        .value
        .trim();


    pairs[i].a =
      document
        .getElementById(
          `text-a-${i}`
        )
        .value
        .trim();


    pairs[i].b =
      document
        .getElementById(
          `text-b-${i}`
        )
        .value
        .trim();

  }


  giftCandidateCount[0] =
    Number(
      document
        .getElementById("gift0")
        .value
    ) || 4;


  giftCandidateCount[1] =
    Number(
      document
        .getElementById("gift1")
        .value
    ) || 6;


  giftCandidateCount[2] =
    Number(
      document
        .getElementById("gift2")
        .value
    ) || 8;


  giftCandidateCount[3] =
    Number(
      document
        .getElementById("gift3")
        .value
    ) || 12;


  closeSettings();

  startGame();

}


/* ==================================================
   SHUFFLE
================================================== */

function shuffle(array){

  for(
    let i=array.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );


    [
      array[i],
      array[j]
    ] = [
      array[j],
      array[i]
    ];

  }

}


/* ==================================================
   CREATE CARDS
================================================== */

function createCards(){

  const board =
    document.getElementById("board");

  board.innerHTML = "";

  board.className =
    "c" + cardCount;


  const data = [];


  const pairCount =
    cardCount / 2;


  for(
    let i=0;
    i<pairCount;
    i++
  ){

    data.push({

      pairId:i,

      text:pairs[i].a,

      image:pairs[i].imageA

    });


    data.push({

      pairId:i,

      text:pairs[i].b,

      image:pairs[i].imageB

    });

  }


  shuffle(data);


  data.forEach(
    (item,index)=>{

      const card =
        document.createElement("div");

      card.className =
        "card";


      card.dataset.index =
        index;


      card.dataset.pairId =
        item.pairId;


      let content = "";


      if(item.image){

        content =
          `<img
             src="${item.image}"
             alt="">`;

      }else{

        content =
          `<div class="card-text">
             ${escapeHTML(
               item.text || "？"
             )}
           </div>`;

      }


      card.innerHTML = `

        <div class="card-inner">

          <div class="card-back">

            <div class="card-number">
              ${index+1}
            </div>

          </div>

          <div class="card-front">

            ${content}

          </div>

        </div>
      `;


      card.addEventListener(
        "click",
        ()=>{
          selectCard(card);
        }
      );


      board.appendChild(card);

    }
  );

}


/* ==================================================
   SELECT CARD
================================================== */

function selectCard(card){

  if(lockBoard)return;

  if(
    card.classList.contains(
      "matched"
    )
  )return;


  if(
    card.classList.contains(
      "flipped"
    )
  )return;


  if(
    selectedGift !== null &&
    candidateIndexes.length > 0
  ){

    const index =
      Number(card.dataset.index);


    if(
      !candidateIndexes
        .includes(index)
    ){

      document
        .getElementById(
          "message"
        )
        .textContent =
        "黄色の候補カードから選んでね！";

      return;

    }

  }


  card.classList.add(
    "flipped"
  );


  if(!firstCard){

    firstCard = card;

    document
      .getElementById(
        "statusMain"
      )
      .textContent =
      "もう1枚選んでね！";

    return;

  }


  secondCard = card;

  checkMatch();

}


/* ==================================================
   CHECK MATCH
================================================== */

function checkMatch(){

  const firstPair =
    Number(
      firstCard.dataset.pairId
    );


  const secondPair =
    Number(
      secondCard.dataset.pairId
    );


  if(
    firstPair === secondPair
  ){

    firstCard.classList.add(
      "matched"
    );

    secondCard.classList.add(
      "matched"
    );


    matchedPairs++;


    const pairName =
      pairs[firstPair].name ||
      "ペア成立！";


    document
      .getElementById(
        "statusMain"
      )
      .textContent =
      "🎉 " +
      pairName +
      " ペア成立！";


    firstCard = null;

    secondCard = null;


    clearCandidates();

    updateStatus();


    if(
      matchedPairs ===
      cardCount / 2
    ){

      setTimeout(
        showComplete,
        700
      );

    }

  }else{

    lockBoard = true;


    document
      .getElementById(
        "statusMain"
      )
      .textContent =
      "残念！";


    setTimeout(
      ()=>{

        firstCard.classList.remove(
          "flipped"
        );

        secondCard.classList.remove(
          "flipped"
        );


        firstCard = null;

        secondCard = null;

        lockBoard = false;


        document
          .getElementById(
            "statusMain"
          )
          .textContent =
          "もう一度選んでね！";

      },
      850
    );

  }

}


/* ==================================================
   GIFT BUTTONS
================================================== */

document
  .querySelectorAll(".gift-btn")
  .forEach(btn=>{

    btn.addEventListener(
      "click",
      ()=>{

        activateGift(
          Number(
            btn.dataset.gift
          )
        );

      }
    );

  });


/* ==================================================
   ACTIVATE GIFT
================================================== */

function activateGift(gift){

  selectedGift = gift;


  document
    .querySelectorAll(".gift-btn")
    .forEach(btn=>{
      btn.classList.remove(
        "active"
      );
    });


  document
    .querySelector(
      `.gift-btn[data-gift="${gift}"]`
    )
    .classList.add(
      "active"
    );


  const available = [];


  document
    .querySelectorAll(".card")
    .forEach(
      (card,index)=>{

        if(
          !card.classList.contains(
            "matched"
          ) &&
          !card.classList.contains(
            "flipped"
          )
        ){

          available.push(index);

        }

      }
    );


  shuffle(available);


  candidateIndexes =
    available.slice(
      0,
      Math.min(
        giftCandidateCount[gift],
        available.length
      )
    );


  showCandidates();


  document
    .getElementById(
      "statusMain"
    )
    .textContent =
    "候補から2枚選んでね！";


  document
    .getElementById(
      "message"
    )
    .textContent =
    "🎁 指定ギフトで候補を絞っています";

}


/* ==================================================
   SHOW CANDIDATES
================================================== */

function showCandidates(){

  const area =
    document.getElementById(
      "candidateArea"
    );


  const list =
    document.getElementById(
      "candidates"
    );


  list.innerHTML = "";


  candidateIndexes
    .forEach(index=>{

      const candidate =
        document.createElement("div");


      candidate.className =
        "candidate";


      candidate.textContent =
        index + 1;


      candidate.addEventListener(
        "click",
        ()=>{

          const card =
            document
              .querySelectorAll(
                ".card"
              )[index];

          if(card){

            selectCard(card);

          }

        }
      );


      list.appendChild(
        candidate
      );

    });


  area.style.display =
    "flex";

}


/* ==================================================
   CLEAR CANDIDATES
================================================== */

function clearCandidates(){

  candidateIndexes = [];

  selectedGift = null;


  document
    .getElementById(
      "candidateArea"
    )
    .style.display =
    "none";


  document
    .querySelectorAll(
      ".gift-btn"
    )
    .forEach(btn=>{
      btn.classList.remove(
        "active"
      );
    });

}


/* ==================================================
   STATUS
================================================== */

function updateStatus(){

  document
    .getElementById(
      "statusSub"
    )
    .textContent =
    "ペア " +
    matchedPairs +
    " / " +
    (cardCount / 2);

}


/* ==================================================
   START
================================================== */

function startGame(){

  matchedPairs = 0;

  firstCard = null;

  secondCard = null;

  lockBoard = false;

  clearCandidates();

  createCards();

  updateStatus();


  document
    .getElementById(
      "statusMain"
    )
    .textContent =
    "ギフトを選んでね！";


  document
    .getElementById(
      "message"
    )
    .textContent =
    "指定ギフトで候補を絞れます！";

}


/* ==================================================
   RESET
================================================== */

function resetGame(){

  startGame();

}


/* ==================================================
   COMPLETE
================================================== */

function showComplete(){

  const img =
    document.getElementById(
      "completeImage"
    );


  if(completeImageData){

    img.src =
      completeImageData;

    img.style.display =
      "block";

  }else{

    img.removeAttribute(
      "src"
    );

    img.style.display =
      "none";

  }


  document
    .getElementById(
      "completeScreen"
    )
    .classList.add(
      "show"
    );

}


/* ==================================================
   CLOSE COMPLETE
================================================== */

function closeComplete(){

  document
    .getElementById(
      "completeScreen"
    )
    .classList.remove(
      "show"
    );

  startGame();

}


/* ==================================================
   INITIAL
================================================== */

createCards();

updateStatus();

</script>

</html>
