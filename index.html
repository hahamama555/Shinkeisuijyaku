<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>ギフト神経衰弱</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;
}

button,input{
  font:inherit;
}

button{
  touch-action:manipulation;
}

/* =========================
   9:16 GAME
========================= */

#stage{
  position:fixed;
  width:min(100vw,56.25vh);
  height:min(100vh,177.7778vw);

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  background:#101010;

  overflow:hidden;

  z-index:1;
}

#game{
  width:100%;
  height:100%;

  padding:1.2%;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}

/* =========================
   HEADER
========================= */

.header{
  flex:0 0 6%;

  min-height:0;

  text-align:center;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  overflow:hidden;
}

.title{
  font-size:5%;
  font-weight:900;
  line-height:1;
  white-space:nowrap;
}

.subtitle{
  margin-top:.8%;
  font-size:2.2%;
  color:#aaa;
  white-space:nowrap;
}

/* =========================
   STATUS
========================= */

.status{
  flex:0 0 6%;

  min-height:0;

  border-radius:8px;

  background:#222;

  display:flex;
  flex-direction:column;

  justify-content:center;
  align-items:center;

  overflow:hidden;
}

.status-main{
  font-size:3%;
  font-weight:900;
  line-height:1;
}

.status-sub{
  margin-top:.7%;
  font-size:2%;
  color:#aaa;
}

/* =========================
   CANDIDATES
========================= */

#candidateArea{
  flex:0 0 9%;

  min-height:0;

  display:none;
  flex-direction:column;

  overflow:hidden;
}

.candidate-title{
  flex:0 0 27%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#ffd400;

  font-size:2.5%;
  font-weight:900;

  white-space:nowrap;
}

.candidates{
  flex:1;

  min-height:0;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:.5%;

  overflow:hidden;
}

.candidate{
  height:92%;
  aspect-ratio:1/1;

  flex:0 1 auto;

  border:2px solid #ffd400;

  border-radius:12%;

  background:#333;

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:4.8%;
  font-weight:900;

  text-shadow:0 2px 3px #000;

  box-shadow:0 0 7px rgba(255,212,0,.5);

  overflow:hidden;
}

.candidate:active{
  transform:scale(.9);
  background:#ffd400;
  color:#111;
}

/* =========================
   BOARD
========================= */

.board-area{
  flex:1;

  min-height:0;

  display:flex;

  align-items:center;
  justify-content:center;

  overflow:hidden;
}

#board{
  width:100%;
  height:100%;

  display:grid;

  align-content:center;
  justify-content:center;

  overflow:hidden;
}

#board.c16{
  grid-template-columns:repeat(4,1fr);
  gap:1.2%;
}

#board.c24{
  grid-template-columns:repeat(6,1fr);
  gap:.9%;
}

#board.c36{
  grid-template-columns:repeat(6,1fr);
  gap:.7%;
}

#board.c48{
  grid-template-columns:repeat(8,1fr);
  gap:.55%;
}

/* =========================
   CARD
========================= */

.card{
  width:100%;
  aspect-ratio:1/1;

  perspective:700px;

  touch-action:manipulation;
}

.card-inner{
  position:relative;

  width:100%;
  height:100%;

  transform-style:preserve-3d;

  transition:transform .3s;
}

.card.flipped .card-inner,
.card.matched .card-inner{
  transform:rotateY(180deg);
}

.card-front,
.card-back{
  position:absolute;

  inset:0;

  border-radius:8%;

  overflow:hidden;

  backface-visibility:hidden;
}

.card-back{
  background:linear-gradient(135deg,#4533c8,#a32bc7);

  border:2px solid #fff;

  display:flex;
  align-items:center;
  justify-content:center;
}

.card-number{
  color:#fff;
  font-size:4%;
  font-weight:900;
  opacity:.8;
}

.card-front{
  background:#fff;

  transform:rotateY(180deg);

  display:flex;
  align-items:center;
  justify-content:center;
}

.card-front img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.card-text{
  width:100%;

  padding:4%;

  color:#111;

  text-align:center;

  font-size:7%;
  font-weight:900;

  line-height:1.1;

  word-break:break-word;
}

.card.matched .card-front{
  border:2px solid #ffd400;

  box-shadow:0 0 8px #ffd400;
}

/* =========================
   BOTTOM
========================= */

.bottom{
  flex:0 0 13%;

  min-height:0;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}

/* =========================
   GIFTS
========================= */

.gifts{
  flex:0 0 48%;

  min-height:0;

  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:1%;

  align-items:center;

  overflow:hidden;
}

.gift-btn{
  width:100%;
  height:72%;

  padding:0;

  border:0;

  border-radius:7px;

  background:#333;

  color:#fff;

  font-size:2%;

  font-weight:900;

  white-space:nowrap;

  overflow:hidden;
}

.gift-btn.active{
  background:#ffd400;
  color:#111;
}

/* =========================
   CONTROL BUTTONS
========================= */

.controls{
  flex:0 0 52%;

  min-height:0;

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:1%;

  align-items:center;

  overflow:hidden;
}

.control{
  width:100%;
  height:72%;

  padding:0;

  border:0;

  border-radius:7px;

  font-size:2.4%;

  font-weight:900;

  white-space:nowrap;
}

.start{
  background:#ffd400;
  color:#111;
}

.reset{
  background:#444;
  color:#fff;
}

.setting{
  background:#333;
  color:#fff;

  position:relative;

  z-index:100;
}

/* =========================
   SETTINGS
========================= */

#settings{
  position:fixed;

  inset:0;

  z-index:5000;

  display:none;

  background:#111;

  overflow-y:auto;

  padding:
    max(15px,env(safe-area-inset-top))
    15px
    max(25px,env(safe-area-inset-bottom))
    15px;
}

#settings.show{
  display:block;
}

.settings-inner{
  max-width:600px;
  margin:auto;
}

.settings-title{
  text-align:center;

  font-size:24px;

  font-weight:900;

  margin-bottom:12px;
}

.section{
  background:#222;

  border-radius:9px;

  padding:10px;

  margin-bottom:10px;
}

.section-title{
  text-align:center;

  font-size:15px;

  font-weight:900;

  margin-bottom:8px;
}

/* =========================
   COUNT
========================= */

.count-grid{
  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:6px;
}

.count-btn{
  padding:10px 2px;

  border:0;

  border-radius:6px;

  background:#444;

  color:#fff;

  font-weight:900;
}

.count-btn.selected{
  background:#ffd400;
  color:#111;
}

/* =========================
   PAIRS
========================= */

.pair-box{
  background:#171717;

  padding:8px;

  border-radius:7px;

  margin-bottom:8px;
}

.pair-header{
  color:#ffd400;

  font-size:13px;

  font-weight:900;

  margin-bottom:6px;
}

.pair-name{
  width:100%;

  padding:8px;

  margin-bottom:6px;

  border:1px solid #555;

  border-radius:5px;

  background:#333;

  color:#fff;
}

.card-settings{
  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:6px;
}

.card-setting{
  background:#292929;

  padding:6px;

  border-radius:6px;
}

.card-label{
  color:#aaa;

  font-size:11px;

  margin-bottom:4px;
}

.card-text-input{
  width:100%;

  padding:7px;

  border:1px solid #555;

  border-radius:5px;

  background:#333;

  color:#fff;

  margin-bottom:5px;
}

.preview{
  width:100%;

  aspect-ratio:1/1;

  border-radius:5px;

  background:#333;

  color:#fff;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  overflow:hidden;

  margin-bottom:5px;
}

.preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.image-label{
  display:block;

  padding:8px 2px;

  background:#444;

  border-radius:5px;

  color:#fff;

  text-align:center;

  font-size:11px;
}

.image-input{
  display:none;
}

/* =========================
   GIFT SETTINGS
========================= */

.gift-row{
  display:grid;

  grid-template-columns:1fr 70px;

  gap:7px;

  align-items:center;

  margin-bottom:7px;
}

.gift-name-input,
.gift-count-input{
  width:100%;

  padding:8px;

  border:1px solid #555;

  border-radius:5px;

  background:#333;

  color:#fff;
}

.gift-row-label{
  color:#fff;

  font-size:12px;
}

/* =========================
   COMPLETE IMAGE
========================= */

.complete-preview{
  width:100%;

  height:140px;

  background:#333;

  border-radius:7px;

  display:flex;

  align-items:center;
  justify-content:center;

  color:#aaa;

  overflow:hidden;

  margin-bottom:7px;
}

.complete-preview img{
  width:100%;
  height:100%;

  object-fit:contain;
}

.complete-label{
  display:block;

  background:#444;

  color:#fff;

  padding:10px;

  border-radius:6px;

  text-align:center;

  font-size:12px;
}

.complete-input{
  display:none;
}

/* =========================
   SETTING BUTTONS
========================= */

.save-btn,
.close-btn{
  width:100%;

  padding:12px;

  border:0;

  border-radius:7px;

  font-weight:900;

  margin-top:7px;
}

.save-btn{
  background:#ffd400;
  color:#111;
}

.close-btn{
  background:#444;
  color:#fff;
}

/* =========================
   COMPLETE
========================= */

#completeScreen{
  position:fixed;

  inset:0;

  z-index:6000;

  display:none;

  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.96);

  padding:15px;
}

#completeScreen.show{
  display:flex;
}

.complete-box{
  width:100%;
  max-width:600px;

  text-align:center;
}

.complete-title{
  color:#ffd400;

  font-size:clamp(28px,8vw,50px);

  font-weight:900;

  margin-bottom:10px;
}

#completeImage{
  width:100%;

  max-height:75vh;

  object-fit:contain;

  border:3px solid #fff;

  border-radius:9px;
}

.complete-close{
  width:100%;

  padding:12px;

  margin-top:10px;

  border:0;

  border-radius:7px;

  background:#ffd400;

  color:#111;

  font-weight:900;
}
</style>
</head>

<body>

<!-- =========================
     9:16 GAME
========================= -->

<div id="stage">

<div id="game">

  <div class="header">

    <div class="title">
      🎴 ギフト神経衰弱
    </div>

    <div
      class="subtitle"
      id="message">
      指定ギフトで候補を絞れます！
    </div>

  </div>


  <div class="status">

    <div
      class="status-main"
      id="statusMain">
      ゲーム開始！
    </div>

    <div
      class="status-sub"
      id="statusSub">
      ペア 0 / 8
    </div>

  </div>


  <!-- 候補 -->

  <div id="candidateArea">

    <div class="candidate-title">
      🎁 候補カードから選んでね！
    </div>

    <div
      class="candidates"
      id="candidates">
    </div>

  </div>


  <!-- カード盤 -->

  <div class="board-area">

    <div
      id="board"
      class="c16">
    </div>

  </div>


  <!-- 下部 -->

  <div class="bottom">

    <div class="gifts">

      <button
        class="gift-btn"
        data-gift="0">
        ❤️ ハートミー
      </button>

      <button
        class="gift-btn"
        data-gift="1">
        🍩 ドーナツ
      </button>

      <button
        class="gift-btn"
        data-gift="2">
        🎁 ギフトA
      </button>

      <button
        class="gift-btn"
        data-gift="3">
        ⭐ 特別ギフト
      </button>

    </div>


    <div class="controls">

      <button
        class="control start"
        id="startBtn">
        🎮 開始
      </button>

      <button
        class="control reset"
        id="resetBtn">
        🔄 リセット
      </button>

      <button
        class="control setting"
        id="settingBtn">
        ⚙️ 設定
      </button>

    </div>

  </div>

</div>
</div>


<!-- =========================
     SETTINGS
========================= -->

<div id="settings">

<div class="settings-inner">

  <div class="settings-title">
    ⚙️ ゲーム設定
  </div>


  <!-- 枚数 -->

  <div class="section">

    <div class="section-title">
      🎴 カード枚数
    </div>

    <div class="count-grid">

      <button
        class="count-btn selected"
        data-count="16">
        16枚
      </button>

      <button
        class="count-btn"
        data-count="24">
        24枚
      </button>

      <button
        class="count-btn"
        data-count="36">
        36枚
      </button>

      <button
        class="count-btn"
        data-count="48">
        48枚
      </button>

    </div>

  </div>


  <!-- ペア -->

  <div class="section">

    <div class="section-title">
      🔗 ペアカードを設定
    </div>

    <div id="pairList"></div>

  </div>


  <!-- ギフト -->

  <div class="section">

    <div class="section-title">
      🎁 指定ギフト設定
    </div>

    <div
      style="
      color:#aaa;
      font-size:11px;
      text-align:center;
      margin-bottom:9px;">
      ギフト名と候補に表示する枚数を自由に設定できます
    </div>


    <!-- ギフト1 -->

    <div class="gift-row">

      <input
        class="gift-name-input"
        id="giftName0"
        value="ハートミー"
        placeholder="ギフト名">

      <input
        class="gift-count-input"
        id="giftCount0"
        type="number"
        min="2"
        value="4">

    </div>


    <!-- ギフト2 -->

    <div class="gift-row">

      <input
        class="gift-name-input"
        id="giftName1"
        value="ドーナツ"
        placeholder="ギフト名">

      <input
        class="gift-count-input"
        id="giftCount1"
        type="number"
        min="2"
        value="6">

    </div>


    <!-- ギフト3 -->

    <div class="gift-row">

      <input
        class="gift-name-input"
        id="giftName2"
        value="ギフトA"
        placeholder="ギフト名">

      <input
        class="gift-count-input"
        id="giftCount2"
        type="number"
        min="2"
        value="8">

    </div>


    <!-- ギフト4 -->

    <div class="gift-row">

      <input
        class="gift-name-input"
        id="giftName3"
        value="特別ギフト"
        placeholder="ギフト名">

      <input
        class="gift-count-input"
        id="giftCount3"
        type="number"
        min="2"
        value="12">

    </div>

  </div>


  <!-- 完成画像 -->

  <div class="section">

    <div class="section-title">
      🖼️ 全部揃った時の完成画像
    </div>

    <div
      id="completePreview"
      class="complete-preview">
      完成画像を設定できます
    </div>

    <label class="complete-label">

      📷 完成画像を選択

      <input
        id="completeInput"
        class="complete-input"
        type="file"
        accept="image/*">

    </label>

  </div>


  <button
    class="save-btn"
    id="saveBtn">
    💾 保存してゲーム開始
  </button>


  <button
    class="close-btn"
    id="closeBtn">
    ✕ 閉じる
  </button>

</div>
</div>


<!-- =========================
     COMPLETE
========================= -->

<div id="completeScreen">

  <div class="complete-box">

    <div class="complete-title">
      🎉 全部完成！ 🎉
    </div>

    <img
      id="completeImage"
      alt="完成画像">

    <div
      style="
      color:#fff;
      margin-top:8px;
      font-size:14px;">
      おめでとう！
    </div>

    <button
      class="complete-close"
      id="completeClose">
      🔄 もう一度ゲームする
    </button>

  </div>

</div>


<script>

/* =========================================
   DATA
========================================= */

let cardCount = 16;

let matchedPairs = 0;

let firstCard = null;

let secondCard = null;

let lockBoard = false;

let selectedGift = null;

let candidateIndexes = [];

let completeImageData = null;


/* =========================================
   GIFT DATA
========================================= */

let gifts = [

  {
    name:"ハートミー",
    count:4
  },

  {
    name:"ドーナツ",
    count:6
  },

  {
    name:"ギフトA",
    count:8
  },

  {
    name:"特別ギフト",
    count:12
  }

];


/* =========================================
   PAIRS
========================================= */

let pairs = [

  ["京都","八ツ橋"],
  ["東京","東京タワー"],
  ["大阪","たこ焼き"],
  ["北海道","カニ"],
  ["沖縄","シーサー"],
  ["福岡","明太子"],
  ["奈良","鹿"],
  ["神奈川","横浜"],
  ["愛知","味噌カツ"],
  ["広島","お好み焼き"],
  ["宮城","牛タン"],
  ["香川","うどん"],
  ["静岡","富士山"],
  ["青森","りんご"],
  ["栃木","餃子"],
  ["熊本","くまモン"],
  ["山梨","ぶどう"],
  ["秋田","きりたんぽ"],
  ["鹿児島","黒豚"],
  ["群馬","温泉"],
  ["石川","金沢"],
  ["千葉","落花生"],
  ["兵庫","神戸牛"],
  ["長野","そば"]

];


/* =========================================
   IMAGES
========================================= */

let pairImages = [];


/* =========================================
   ESCAPE
========================================= */

function esc(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


/* =========================================
   SETTINGS OPEN
========================================= */

function openSettings(){

  document
    .getElementById("settings")
    .classList.add("show");

  createPairSettings();

}


/* =========================================
   SETTINGS CLOSE
========================================= */

function closeSettings(){

  document
    .getElementById("settings")
    .classList.remove("show");

}


/* =========================================
   PAIR SETTINGS
========================================= */

function createPairSettings(){

  const list =
    document.getElementById("pairList");

  list.innerHTML = "";

  const count =
    cardCount / 2;


  for(
    let i=0;
    i<count;
    i++
  ){

    if(!pairImages[i]){

      pairImages[i]={
        a:null,
        b:null
      };

    }


    const pair =
      pairs[i] || ["",""];


    const box =
      document.createElement("div");

    box.className =
      "pair-box";


    box.innerHTML = `

      <div class="pair-header">
        🔗 ペア ${i+1}
      </div>

      <input
        class="pair-name"
        id="pairName${i}"
        placeholder="ペア名（例：京都名物）">

      <div class="card-settings">

        <div class="card-setting">

          <div class="card-label">
            カード①
          </div>

          <input
            class="card-text-input"
            id="pairA${i}"
            value="${esc(pair[0])}"
            placeholder="京都">

          <div
            class="preview"
            id="previewA${i}">
            ${esc(pair[0])}
          </div>

          <label class="image-label">

            📷 画像設定

            <input
              class="image-input"
              type="file"
              accept="image/*"
              data-index="${i}"
              data-side="a">

          </label>

        </div>


        <div class="card-setting">

          <div class="card-label">
            カード②
          </div>

          <input
            class="card-text-input"
            id="pairB${i}"
            value="${esc(pair[1])}"
            placeholder="八ツ橋">

          <div
            class="preview"
            id="previewB${i}">
            ${esc(pair[1])}
          </div>

          <label class="image-label">

            📷 画像設定

            <input
              class="image-input"
              type="file"
              accept="image/*"
              data-index="${i}"
              data-side="b">

          </label>

        </div>

      </div>

    `;


    list.appendChild(box);


    if(pairImages[i].a){

      document
        .getElementById(
          `previewA${i}`
        )
        .innerHTML =
        `<img src="${pairImages[i].a}">`;

    }


    if(pairImages[i].b){

      document
        .getElementById(
          `previewB${i}`
        )
        .innerHTML =
        `<img src="${pairImages[i].b}">`;

    }

  }


  document
    .querySelectorAll(".image-input")
    .forEach(input=>{

      input.addEventListener(
        "change",
        function(){

          const file =
            this.files[0];

          if(!file)return;


          const index =
            Number(this.dataset.index);

          const side =
            this.dataset.side;


          const reader =
            new FileReader();


          reader.onload =
            function(e){

              if(!pairImages[index]){

                pairImages[index]={
                  a:null,
                  b:null
                };

              }


              pairImages[index][side] =
                e.target.result;


              const preview =
                document.getElementById(
                  side === "a"
                    ? `previewA${index}`
                    : `previewB${index}`
                );


              preview.innerHTML =
                `<img src="${e.target.result}">`;

            };


          reader.readAsDataURL(file);

        }
      );

    });

}


/* =========================================
   COUNT BUTTON
========================================= */

document
  .querySelectorAll(".count-btn")
  .forEach(btn=>{

    btn.addEventListener(
      "click",
      function(){

        document
          .querySelectorAll(".count-btn")
          .forEach(b=>{
            b.classList.remove(
              "selected"
            );
          });


        this.classList.add(
          "selected"
        );


        cardCount =
          Number(
            this.dataset.count
          );


        createPairSettings();

      }
    );

  });


/* =========================================
   COMPLETE IMAGE
========================================= */

document
  .getElementById("completeInput")
  .addEventListener(
    "change",
    function(){

      const file =
        this.files[0];

      if(!file)return;


      const reader =
        new FileReader();


      reader.onload =
        function(e){

          completeImageData =
            e.target.result;


          document
            .getElementById(
              "completePreview"
            )
            .innerHTML =
            `<img src="${completeImageData}">`;

        };


      reader.readAsDataURL(file);

    }
  );


/* =========================================
   SAVE
========================================= */

function saveSettings(){

  const count =
    cardCount / 2;


  for(
    let i=0;
    i<count;
    i++
  ){

    if(!pairs[i]){

      pairs[i]=["",""];

    }


    pairs[i][0] =
      document
        .getElementById(
          `pairA${i}`
        )
        .value
        .trim();


    pairs[i][1] =
      document
        .getElementById(
          `pairB${i}`
        )
        .value
        .trim();

  }


  for(
    let i=0;
    i<4;
    i++
  ){

    gifts[i].name =
      document
        .getElementById(
          `giftName${i}`
        )
        .value
        .trim() ||
      "ギフト";


    gifts[i].count =
      Math.max(
        2,
        Number(
          document
            .getElementById(
              `giftCount${i}`
            )
            .value
        ) || 2
      );

  }


  updateGiftButtons();

  closeSettings();

  startGame();

}


/* =========================================
   UPDATE GIFT BUTTONS
========================================= */

function updateGiftButtons(){

  document
    .querySelectorAll(".gift-btn")
    .forEach(
      function(btn,index){

        btn.textContent =
          gifts[index].name;

      }
    );

}


/* =========================================
   SHUFFLE
========================================= */

function shuffle(arr){

  for(
    let i=arr.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );


    [
      arr[i],
      arr[j]
    ] =
    [
      arr[j],
      arr[i]
    ];

  }

}


/* =========================================
   CREATE CARDS
========================================= */

function createCards(){

  const board =
    document.getElementById("board");

  board.innerHTML = "";

  board.className =
    "c" + cardCount;


  const data=[];


  for(
    let i=0;
    i<cardCount/2;
    i++
  ){

    const pair =
      pairs[i] || ["",""];


    const imgs =
      pairImages[i] || {
        a:null,
        b:null
      };


    data.push({

      pairId:i,

      text:pair[0],

      image:imgs.a

    });


    data.push({

      pairId:i,

      text:pair[1],

      image:imgs.b

    });

  }


  shuffle(data);


  data.forEach(
    function(item,index){

      const card =
        document.createElement("div");

      card.className =
        "card";


      card.dataset.index =
        index;


      card.dataset.pairId =
        item.pairId;


      let front;


      if(item.image){

        front =
          `<img src="${item.image}" alt="">`;

      }else{

        front =
          `<div class="card-text">
            ${esc(item.text)}
          </div>`;

      }


      card.innerHTML = `

        <div class="card-inner">

          <div class="card-back">

            <div class="card-number">
              ${index+1}
            </div>

          </div>

          <div class="card-front">

            ${front}

          </div>

        </div>

      `;


      card.addEventListener(
        "click",
        function(){

          selectCard(card);

        }
      );


      board.appendChild(card);

    }
  );

}


/* =========================================
   SELECT CARD
========================================= */

function selectCard(card){

  if(lockBoard)return;


  if(
    card.classList.contains(
      "matched"
    )
  )return;


  if(
    card.classList.contains(
      "flipped"
    )
  )return;


  if(
    selectedGift !== null &&
    candidateIndexes.length
  ){

    const index =
      Number(
        card.dataset.index
      );


    if(
      !candidateIndexes.includes(
        index
      )
    ){

      document
        .getElementById(
          "message"
        )
        .textContent =
        "候補カードから選んでね！";

      return;

    }

  }


  card.classList.add(
    "flipped"
  );


  if(!firstCard){

    firstCard =
      card;

    document
      .getElementById(
        "statusMain"
      )
      .textContent =
      "もう1枚選んでね！";

    return;

  }


  secondCard =
    card;


  checkMatch();

}


/* =========================================
   CHECK
========================================= */

function checkMatch(){

  const a =
    Number(
      firstCard.dataset.pairId
    );


  const b =
    Number(
      secondCard.dataset.pairId
    );


  if(a===b){

    firstCard.classList.add(
      "matched"
    );

    secondCard.classList.add(
      "matched"
    );


    matchedPairs++;


    document
      .getElementById(
        "statusMain"
      )
      .textContent =
      "🎉 ペア成立！";


    firstCard=null;

    secondCard=null;

    clearCandidates();

    updateStatus();


    if(
      matchedPairs >=
      cardCount/2
    ){

      setTimeout(
        showComplete,
        600
      );

    }

  }else{

    lockBoard=true;


    document
      .getElementById(
        "statusMain"
      )
      .textContent =
      "❌ ペアではありません";


    setTimeout(
      function(){

        firstCard.classList.remove(
          "flipped"
        );

        secondCard.classList.remove(
          "flipped"
        );


        firstCard=null;

        secondCard=null;

        lockBoard=false;


        document
          .getElementById(
            "statusMain"
          )
          .textContent =
          "もう一度！";

      },
      850
    );

  }

}


/* =========================================
   GIFT BUTTONS
========================================= */

document
  .querySelectorAll(".gift-btn")
  .forEach(btn=>{

    btn.addEventListener(
      "click",
      function(){

        activateGift(
          Number(
            this.dataset.gift
          )
        );

      }
    );

  });


/* =========================================
   ACTIVATE GIFT
========================================= */

function activateGift(gift){

  selectedGift =
    gift;


  document
    .querySelectorAll(".gift-btn")
    .forEach(
      function(btn){

        btn.classList.remove(
          "active"
        );

      }
    );


  document
    .querySelector(
      `.gift-btn[data-gift="${gift}"]`
    )
    .classList.add(
      "active"
    );


  const available=[];


  document
    .querySelectorAll(".card")
    .forEach(
      function(card,index){

        if(
          !card.classList.contains(
            "matched"
          ) &&
          !card.classList.contains(
            "flipped"
          )
        ){

          available.push(index);

        }

      }
    );


  shuffle(available);


  candidateIndexes =
    available.slice(
      0,
      Math.min(
        gifts[gift].count,
        available.length
      )
    );


  showCandidates();


  document
    .getElementById(
      "statusMain"
    )
    .textContent =
    "候補から2枚選んでね！";

}


/* =========================================
   SHOW CANDIDATES
========================================= */

function showCandidates(){

  const area =
    document.getElementById(
      "candidateArea"
    );


  const list =
    document.getElementById(
      "candidates"
    );


  list.innerHTML="";


  candidateIndexes
    .forEach(
      function(index){

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "candidate";


        item.textContent =
          index+1;


        item.addEventListener(
          "click",
          function(){

            const cards =
              document.querySelectorAll(
                ".card"
              );


            if(cards[index]){

              selectCard(
                cards[index]
              );

            }

          }
        );


        list.appendChild(item);

      }
    );


  area.style.display="flex";

}


/* =========================================
   CLEAR CANDIDATES
========================================= */

function clearCandidates(){

  candidateIndexes=[];

  selectedGift=null;


  document
    .getElementById(
      "candidateArea"
    )
    .style.display="none";


  document
    .querySelectorAll(".gift-btn")
    .forEach(
      function(btn){

        btn.classList.remove(
          "active"
        );

      }
    );

}


/* =========================================
   STATUS
========================================= */

function updateStatus(){

  document
    .getElementById(
      "statusSub"
    )
    .textContent =
    "ペア " +
    matchedPairs +
    " / " +
    cardCount/2;

}


/* =========================================
   START
========================================= */

function startGame(){

  matchedPairs=0;

  firstCard=null;

  secondCard=null;

  lockBoard=false;

  clearCandidates();

  createCards();

  updateStatus();


  document
    .getElementById(
      "statusMain"
    )
    .textContent =
    "ギフトを選んでね！";


  document
    .getElementById(
      "message"
    )
    .textContent =
    "指定ギフトで候補を絞れます！";

}


/* =========================================
   COMPLETE
========================================= */

function showComplete(){

  const screen =
    document.getElementById(
      "completeScreen"
    );


  const img =
    document.getElementById(
      "completeImage"
    );


  if(completeImageData){

    img.src =
      completeImageData;

    img.style.display="block";

  }else{

    img.style.display="none";

  }


  screen.classList.add(
    "show"
  );

}


/* =========================================
   EVENTS
========================================= */

document
  .getElementById("settingBtn")
  .addEventListener(
    "click",
    function(e){

      e.preventDefault();

      e.stopPropagation();

      openSettings();

    }
  );


document
  .getElementById("closeBtn")
  .addEventListener(
    "click",
    closeSettings
  );


document
  .getElementById("saveBtn")
  .addEventListener(
    "click",
    saveSettings
  );


document
  .getElementById("startBtn")
  .addEventListener(
    "click",
    startGame
  );


document
  .getElementById("resetBtn")
  .addEventListener(
    "click",
    startGame
  );


document
  .getElementById("completeClose")
  .addEventListener(
    "click",
    function(){

      document
        .getElementById(
          "completeScreen"
        )
        .classList.remove(
          "show"
        );

      startGame();

    }
  );


/* =========================================
   INITIAL
========================================= */

updateGiftButtons();

createPairSettings();

startGame();

</script>
