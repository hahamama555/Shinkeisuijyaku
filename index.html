<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>ギフト神経衰弱</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Yu Gothic",
    sans-serif;
}

button,
input{
  font:inherit;
}

button{
  touch-action:manipulation;
}

/* ========================================
   9:16 STAGE
======================================== */

#stage{
  position:fixed;

  width:min(100vw,56.25vh);
  height:min(100vh,177.7778vw);

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  background:#111;

  overflow:hidden;

  z-index:1;
}

/* ========================================
   GAME
======================================== */

#game{
  width:100%;
  height:100%;

  padding:1.4%;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}

/* ========================================
   HEADER
======================================== */

.header{
  flex:0 0 7%;

  min-height:0;

  display:flex;
  flex-direction:column;

  justify-content:center;
  align-items:center;

  text-align:center;

  overflow:hidden;
}

.title{
  font-size:5%;
  font-weight:900;

  line-height:1;

  white-space:nowrap;
}

.subtitle{
  margin-top:1%;

  font-size:2.3%;

  color:#aaa;

  white-space:nowrap;
}

/* ========================================
   STATUS
======================================== */

.status{
  flex:0 0 7%;

  min-height:0;

  background:#222;

  border-radius:8px;

  display:flex;
  flex-direction:column;

  justify-content:center;
  align-items:center;

  overflow:hidden;
}

.status-main{
  font-size:3.2%;

  font-weight:900;

  line-height:1;
}

.status-sub{
  margin-top:1%;

  color:#aaa;

  font-size:2.1%;
}

/* ========================================
   CANDIDATE AREA
======================================== */

#candidateArea{
  flex:0 0 10%;

  min-height:0;

  display:none;
  flex-direction:column;

  overflow:hidden;
}

.candidate-title{
  flex:0 0 30%;

  display:flex;

  justify-content:center;
  align-items:center;

  color:#ffd400;

  font-size:2.5%;

  font-weight:900;

  white-space:nowrap;
}

.candidates{
  flex:1;

  min-height:0;

  display:flex;

  justify-content:center;
  align-items:center;

  gap:.8%;

  overflow:hidden;
}

.candidate{
  height:90%;
  aspect-ratio:1/1;

  flex:0 1 auto;

  border:2px solid #ffd400;

  border-radius:10px;

  background:#333;

  color:#fff;

  display:flex;

  justify-content:center;
  align-items:center;

  font-size:4.8%;

  font-weight:900;

  box-shadow:
    0 0 8px rgba(255,212,0,.4);

  overflow:hidden;

  cursor:pointer;
}

.candidate:active{
  transform:scale(.9);

  background:#ffd400;

  color:#111;
}

/* ========================================
   BOARD
======================================== */

.board-area{
  flex:1;

  min-height:0;

  display:flex;

  justify-content:center;
  align-items:center;

  overflow:hidden;
}

#board{
  width:100%;
  height:100%;

  display:grid;

  justify-content:center;
  align-content:center;

  overflow:hidden;
}

#board.c16{
  grid-template-columns:repeat(4,1fr);

  gap:1.2%;
}

#board.c24{
  grid-template-columns:repeat(6,1fr);

  gap:.9%;
}

#board.c36{
  grid-template-columns:repeat(6,1fr);

  gap:.7%;
}

#board.c48{
  grid-template-columns:repeat(8,1fr);

  gap:.55%;
}

/* ========================================
   CARD
======================================== */

.card{
  width:100%;

  aspect-ratio:1/1;

  perspective:800px;

  cursor:pointer;

  touch-action:manipulation;
}

.card-inner{
  position:relative;

  width:100%;
  height:100%;

  transform-style:preserve-3d;

  transition:
    transform .28s ease;
}

.card.flipped .card-inner,
.card.matched .card-inner{
  transform:rotateY(180deg);
}

.card-front,
.card-back{
  position:absolute;

  inset:0;

  border-radius:8px;

  overflow:hidden;

  backface-visibility:hidden;
}

/* 裏面 */

.card-back{
  background:
    linear-gradient(
      135deg,
      #4533c8,
      #a32bc7
    );

  border:2px solid #fff;

  display:flex;

  justify-content:center;
  align-items:center;
}

.card-number{
  color:#fff;

  font-size:4%;

  font-weight:900;

  opacity:.8;
}

/* 表面 */

.card-front{
  background:#fff;

  transform:rotateY(180deg);

  display:flex;

  justify-content:center;
  align-items:center;

  text-align:center;
}

.card-front img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.card-text{
  width:100%;

  padding:5%;

  color:#111;

  font-size:7%;

  font-weight:900;

  line-height:1.15;

  word-break:break-word;
}

.card.matched .card-front{
  border:2px solid #ffd400;

  box-shadow:
    0 0 10px #ffd400;
}

/* ========================================
   BOTTOM
======================================== */

.bottom{
  flex:0 0 13%;

  min-height:0;

  display:flex;

  flex-direction:column;

  overflow:hidden;
}

/* ========================================
   GIFT BUTTONS
======================================== */

.gifts{
  flex:0 0 48%;

  min-height:0;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:1%;

  align-items:center;

  overflow:hidden;
}

.gift-btn{
  width:100%;
  height:75%;

  border:0;

  border-radius:7px;

  background:#333;

  color:#fff;

  font-size:2%;

  font-weight:900;

  white-space:nowrap;

  overflow:hidden;

  padding:0;
}

.gift-btn.active{
  background:#ffd400;

  color:#111;
}

.gift-btn:active{
  transform:scale(.96);
}

/* ========================================
   CONTROL
======================================== */

.controls{
  flex:0 0 52%;

  min-height:0;

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:1%;

  align-items:center;

  overflow:hidden;
}

.control{
  width:100%;
  height:75%;

  border:0;

  border-radius:7px;

  font-size:2.5%;

  font-weight:900;

  white-space:nowrap;

  padding:0;
}

.start{
  background:#ffd400;

  color:#111;
}

.reset{
  background:#444;

  color:#fff;
}

.setting{
  background:#333;

  color:#fff;

  position:relative;

  z-index:100;
}

.control:active{
  transform:scale(.96);
}

/* ========================================
   SETTINGS
======================================== */

#settings{
  position:fixed;

  inset:0;

  z-index:5000;

  display:none;

  background:#111;

  color:#fff;

  overflow-y:auto;

  -webkit-overflow-scrolling:touch;

  padding:
    max(14px,env(safe-area-inset-top))
    14px
    max(24px,env(safe-area-inset-bottom))
    14px;
}

#settings.show{
  display:block;
}

.settings-inner{
  width:100%;

  max-width:600px;

  margin:0 auto;
}

.settings-title{
  text-align:center;

  font-size:24px;

  font-weight:900;

  margin-bottom:12px;
}

/* ========================================
   SETTINGS SECTION
======================================== */

.section{
  background:#222;

  border-radius:9px;

  padding:10px;

  margin-bottom:10px;
}

.section-title{
  text-align:center;

  font-size:15px;

  font-weight:900;

  margin-bottom:9px;
}

/* ========================================
   CARD COUNT
======================================== */

.count-grid{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:6px;
}

.count-btn{
  border:0;

  border-radius:6px;

  padding:10px 2px;

  background:#444;

  color:#fff;

  font-size:13px;

  font-weight:900;
}

.count-btn.selected{
  background:#ffd400;

  color:#111;
}

/* ========================================
   PAIR SETTINGS
======================================== */

.pair-box{
  background:#171717;

  border-radius:7px;

  padding:8px;

  margin-bottom:8px;
}

.pair-header{
  color:#ffd400;

  font-size:13px;

  font-weight:900;

  margin-bottom:6px;
}

.pair-name{
  width:100%;

  padding:8px;

  border:1px solid #555;

  border-radius:5px;

  background:#333;

  color:#fff;

  margin-bottom:7px;
}

.card-settings{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:6px;
}

.card-setting{
  background:#292929;

  border-radius:6px;

  padding:6px;
}

.card-label{
  color:#aaa;

  font-size:11px;

  margin-bottom:4px;
}

.card-text-input{
  width:100%;

  padding:7px;

  border:1px solid #555;

  border-radius:5px;

  background:#333;

  color:#fff;

  margin-bottom:5px;
}

.preview{
  width:100%;

  aspect-ratio:1/1;

  border-radius:5px;

  background:#333;

  color:#fff;

  display:flex;

  justify-content:center;
  align-items:center;

  text-align:center;

  overflow:hidden;

  margin-bottom:5px;

  font-size:14px;

  font-weight:900;
}

.preview img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.image-label{
  display:block;

  width:100%;

  padding:8px 2px;

  background:#444;

  border-radius:5px;

  color:#fff;

  text-align:center;

  font-size:11px;
}

.image-input{
  display:none;
}

/* ========================================
   GIFT SETTINGS
======================================== */

.gift-info{
  color:#aaa;

  text-align:center;

  font-size:11px;

  line-height:1.5;

  margin-bottom:9px;
}

.gift-setting-row{
  display:grid;

  grid-template-columns:
    1fr 70px;

  gap:7px;

  align-items:center;

  margin-bottom:7px;
}

.gift-name-input,
.gift-count-input{
  width:100%;

  padding:8px;

  border:1px solid #555;

  border-radius:5px;

  background:#333;

  color:#fff;

  min-width:0;
}

.gift-count-input{
  text-align:center;
}

/* ========================================
   COMPLETE IMAGE
======================================== */

.complete-preview{
  width:100%;

  height:140px;

  background:#333;

  border-radius:7px;

  display:flex;

  justify-content:center;
  align-items:center;

  color:#aaa;

  overflow:hidden;

  margin-bottom:7px;

  text-align:center;

  font-size:12px;
}

.complete-preview img{
  width:100%;
  height:100%;

  object-fit:contain;
}

.complete-label{
  display:block;

  background:#444;

  color:#fff;

  padding:10px;

  border-radius:6px;

  text-align:center;

  font-size:12px;
}

.complete-input{
  display:none;
}

/* ========================================
   SETTINGS BUTTONS
======================================== */

.save-btn,
.close-btn{
  width:100%;

  border:0;

  border-radius:7px;

  padding:12px;

  font-weight:900;

  margin-top:7px;
}

.save-btn{
  background:#ffd400;

  color:#111;
}

.close-btn{
  background:#444;

  color:#fff;
}

/* ========================================
   COMPLETE SCREEN
======================================== */

#completeScreen{
  position:fixed;

  inset:0;

  z-index:6000;

  display:none;

  justify-content:center;
  align-items:center;

  background:rgba(0,0,0,.96);

  padding:15px;
}

#completeScreen.show{
  display:flex;
}

.complete-box{
  width:100%;

  max-width:600px;

  text-align:center;
}

.complete-title{
  color:#ffd400;

  font-size:
    clamp(28px,8vw,50px);

  font-weight:900;

  margin-bottom:10px;
}

#completeImage{
  width:100%;

  max-height:70vh;

  object-fit:contain;

  border:3px solid #fff;

  border-radius:9px;

  background:#222;
}

.complete-message{
  color:#fff;

  font-size:14px;

  margin-top:8px;
}

.complete-close{
  width:100%;

  border:0;

  border-radius:7px;

  background:#ffd400;

  color:#111;

  padding:12px;

  margin-top:10px;

  font-weight:900;
}

/* ========================================
   SMALL SCREEN SAFETY
======================================== */

@media(max-height:600px){

  .settings-title{
    font-size:20px;
  }

  .section{
    padding:8px;

    margin-bottom:7px;
  }

  .pair-box{
    padding:6px;

    margin-bottom:6px;
  }

  .complete-preview{
    height:100px;
  }

}
</style>
</head>

<body>

<!-- ========================================
     9:16 GAME
======================================== -->

<div id="stage">

  <div id="game">

    <div class="header">

      <div class="title">
        🎴 ギフト神経衰弱
      </div>

      <div
        class="subtitle"
        id="message">
        指定ギフトで候補を絞れます！
      </div>

    </div>


    <div class="status">

      <div
        class="status-main"
        id="statusMain">
        ゲーム開始！
      </div>

      <div
        class="status-sub"
        id="statusSub">
        ペア 0 / 8
      </div>

    </div>


    <!-- 候補 -->

    <div id="candidateArea">

      <div class="candidate-title">
        🎁 候補カードを選んでね！
      </div>

      <div
        class="candidates"
        id="candidates">
      </div>

    </div>


    <!-- カード -->

    <div class="board-area">

      <div
        id="board"
        class="c16">
      </div>

    </div>


    <!-- 下部 -->

    <div class="bottom">

      <div class="gifts">

        <button
          class="gift-btn"
          data-gift="0">
          ハートミー
        </button>

        <button
          class="gift-btn"
          data-gift="1">
          ドーナツ
        </button>

        <button
          class="gift-btn"
          data-gift="2">
          ギフトA
        </button>

        <button
          class="gift-btn"
          data-gift="3">
          特別ギフト
        </button>

      </div>


      <div class="controls">

        <button
          class="control start"
          id="startBtn">
          🎮 開始
        </button>

        <button
          class="control reset"
          id="resetBtn">
          🔄 リセット
        </button>

        <button
          class="control setting"
          id="settingBtn">
          ⚙️ 設定
        </button>

      </div>

    </div>

  </div>

</div>


<!-- ========================================
     SETTINGS
======================================== -->

<div id="settings">

  <div class="settings-inner">

    <div class="settings-title">
      ⚙️ ゲーム設定
    </div>


    <!-- 枚数 -->

    <div class="section">

      <div class="section-title">
        🎴 カード枚数
      </div>

      <div class="count-grid">

        <button
          class="count-btn selected"
          data-count="16">
          16枚
        </button>

        <button
          class="count-btn"
          data-count="24">
          24枚
        </button>

        <button
          class="count-btn"
          data-count="36">
          36枚
        </button>

        <button
          class="count-btn"
          data-count="48">
          48枚
        </button>

      </div>

    </div>


    <!-- ペア -->

    <div class="section">

      <div class="section-title">
        🔗 ペアカード設定
      </div>

      <div
        class="gift-info">
        例：カード①「京都」＋カード②「八ツ橋」<br>
        文字の代わりに画像を設定することもできます。
      </div>

      <div id="pairList"></div>

    </div>


    <!-- ギフト -->

    <div class="section">

      <div class="section-title">
        🎁 指定ギフト設定
      </div>

      <div class="gift-info">
        ギフト名と、ギフトを受け取った時に<br>
        表示する候補カード数を設定できます。
      </div>


      <div class="gift-setting-row">

        <input
          class="gift-name-input"
          id="giftName0"
          value="ハートミー"
          placeholder="ギフト名">

        <input
          class="gift-count-input"
          id="giftCount0"
          type="number"
          min="2"
          value="4">

      </div>


      <div class="gift-setting-row">

        <input
          class="gift-name-input"
          id="giftName1"
          value="ドーナツ"
          placeholder="ギフト名">

        <input
          class="gift-count-input"
          id="giftCount1"
          type="number"
          min="2"
          value="6">

      </div>


      <div class="gift-setting-row">

        <input
          class="gift-name-input"
          id="giftName2"
          value="ギフトA"
          placeholder="ギフト名">

        <input
          class="gift-count-input"
          id="giftCount2"
          type="number"
          min="2"
          value="8">

      </div>


      <div class="gift-setting-row">

        <input
          class="gift-name-input"
          id="giftName3"
          value="特別ギフト"
          placeholder="ギフト名">

        <input
          class="gift-count-input"
          id="giftCount3"
          type="number"
          min="2"
          value="12">

      </div>

    </div>


    <!-- 完成画像 -->

    <div class="section">

      <div class="section-title">
        🖼️ 全部揃った時の完成画像
      </div>

      <div
        id="completePreview"
        class="complete-preview">
        ここに完成画像が表示されます
      </div>

      <label class="complete-label">

        📷 完成画像を選択

        <input
          id="completeInput"
          class="complete-input"
          type="file"
          accept="image/*">

      </label>

    </div>


    <button
      class="save-btn"
      id="saveBtn">
      💾 保存してゲーム開始
    </button>


    <button
      class="close-btn"
      id="closeBtn">
      ✕ 閉じる
    </button>

  </div>

</div>


<!-- ========================================
     COMPLETE
======================================== -->

<div id="completeScreen">

  <div class="complete-box">

    <div class="complete-title">
      🎉 全部完成！ 🎉
    </div>

    <img
      id="completeImage"
      alt="完成画像">

    <div class="complete-message">
      おめでとう！
    </div>

    <button
      class="complete-close"
      id="completeClose">
      🔄 もう一度ゲームする
    </button>

  </div>

</div>


<script>

/* ========================================
   基本設定
======================================== */

let cardCount = 16;

let matchedPairs = 0;

let firstCard = null;

let secondCard = null;

let lockBoard = false;

let selectedGift = null;

let candidateIndexes = [];

let completeImageData = null;


/* ========================================
   ギフト
======================================== */

let gifts = [

  {
    name:"ハートミー",
    count:4
  },

  {
    name:"ドーナツ",
    count:6
  },

  {
    name:"ギフトA",
    count:8
  },

  {
    name:"特別ギフト",
    count:12
  }

];


/* ========================================
   ペア
======================================== */

let pairs = [

  ["京都","八ツ橋"],
  ["東京","東京タワー"],
  ["大阪","たこ焼き"],
  ["北海道","カニ"],
  ["沖縄","シーサー"],
  ["福岡","明太子"],
  ["奈良","鹿"],
  ["神奈川","横浜"],
  ["愛知","味噌カツ"],
  ["広島","お好み焼き"],
  ["宮城","牛タン"],
  ["香川","うどん"],
  ["静岡","富士山"],
  ["青森","りんご"],
  ["栃木","餃子"],
  ["熊本","くまモン"],
  ["山梨","ぶどう"],
  ["秋田","きりたんぽ"],
  ["鹿児島","黒豚"],
  ["群馬","温泉"],
  ["石川","金沢"],
  ["千葉","落花生"],
  ["兵庫","神戸牛"],
  ["長野","そば"]

];


/* ========================================
   ペア画像
======================================== */

let pairImages = [];


/* ========================================
   HTMLエスケープ
======================================== */

function esc(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


/* ========================================
   設定を開く
======================================== */

function openSettings(){

  createPairSettings();

  document
    .getElementById("settings")
    .classList.add("show");

}


/* ========================================
   設定を閉じる
======================================== */

function closeSettings(){

  document
    .getElementById("settings")
    .classList.remove("show");

}


/* ========================================
   ペア設定画面
======================================== */

function createPairSettings(){

  const list =
    document.getElementById("pairList");

  list.innerHTML = "";


  const count =
    cardCount / 2;


  for(
    let i=0;
    i<count;
    i++
  ){

    if(!pairs[i]){

      pairs[i]=["",""];

    }


    if(!pairImages[i]){

      pairImages[i]={
        a:null,
        b:null
      };

    }


    const pair =
      pairs[i];


    const box =
      document.createElement("div");

    box.className =
      "pair-box";


    box.innerHTML = `

      <div class="pair-header">
        🔗 ペア ${i+1}
      </div>


      <input
        class="pair-name"
        id="pairName${i}"
        placeholder="ペア名（任意）">


      <div class="card-settings">

        <div class="card-setting">

          <div class="card-label">
            カード①
          </div>

          <input
            class="card-text-input"
            id="pairA${i}"
            value="${esc(pair[0])}"
            placeholder="京都">


          <div
            class="preview"
            id="previewA${i}">
            ${esc(pair[0])}
          </div>


          <label class="image-label">

            📷 画像を設定

            <input
              class="image-input"
              type="file"
              accept="image/*"
              data-index="${i}"
              data-side="a">

          </label>

        </div>


        <div class="card-setting">

          <div class="card-label">
            カード②
          </div>

          <input
            class="card-text-input"
            id="pairB${i}"
            value="${esc(pair[1])}"
            placeholder="八ツ橋">


          <div
            class="preview"
            id="previewB${i}">
            ${esc(pair[1])}
          </div>


          <label class="image-label">

            📷 画像を設定

            <input
              class="image-input"
              type="file"
              accept="image/*"
              data-index="${i}"
              data-side="b">

          </label>

        </div>

      </div>

    `;


    list.appendChild(box);


    if(pairImages[i].a){

      document
        .getElementById(
          `previewA${i}`
        )
        .innerHTML =
        `<img src="${pairImages[i].a}" alt="">`;

    }


    if(pairImages[i].b){

      document
        .getElementById(
          `previewB${i}`
        )
        .innerHTML =
        `<img src="${pairImages[i].b}" alt="">`;

    }

  }


  document
    .querySelectorAll(".image-input")
    .forEach(
      input=>{

        input.addEventListener(
          "change",
          function(){

            const file =
              this.files[0];

            if(!file)return;


            const index =
              Number(
                this.dataset.index
              );


            const side =
              this.dataset.side;


            const reader =
              new FileReader();


            reader.onload =
              function(e){

                if(!pairImages[index]){

                  pairImages[index]={
                    a:null,
                    b:null
                  };

                }


                pairImages[index][side] =
                  e.target.result;


                const preview =
                  document.getElementById(
                    side === "a"
                    ? `previewA${index}`
                    : `previewB${index}`
                  );


                preview.innerHTML =
                  `<img src="${e.target.result}" alt="">`;

              };


            reader.readAsDataURL(file);

          }
        );

      }
    );

}


/* ========================================
   枚数変更
======================================== */

document
  .querySelectorAll(".count-btn")
  .forEach(
    btn=>{

      btn.addEventListener(
        "click",
        function(){

          document
            .querySelectorAll(".count-btn")
            .forEach(
              b=>{
                b.classList.remove(
                  "selected"
                );
              }
            );


          this.classList.add(
            "selected"
          );


          cardCount =
            Number(
              this.dataset.count
            );


          createPairSettings();

        }
      );

    }
  );


/* ========================================
   完成画像
======================================== */

document
  .getElementById("completeInput")
  .addEventListener(
    "change",
    function(){

      const file =
        this.files[0];

      if(!file)return;


      const reader =
        new FileReader();


      reader.onload =
        function(e){

          completeImageData =
            e.target.result;


          document
            .getElementById(
              "completePreview"
            )
            .innerHTML =
            `<img src="${completeImageData}" alt="">`;

        };


      reader.readAsDataURL(file);

    }
  );


/* ========================================
   設定保存
======================================== */

function saveSettings(){

  const count =
    cardCount / 2;


  for(
    let i=0;
    i<count;
    i++
  ){

    if(!pairs[i]){

      pairs[i]=["",""];

    }


    const a =
      document.getElementById(
        `pairA${i}`
      );


    const b =
      document.getElementById(
        `pairB${i}`
      );


    if(a){

      pairs[i][0] =
        a.value.trim();

    }


    if(b){

      pairs[i][1] =
        b.value.trim();

    }

  }


  for(
    let i=0;
    i<4;
    i++
  ){

    const nameInput =
      document.getElementById(
        `giftName${i}`
      );


    const countInput =
      document.getElementById(
        `giftCount${i}`
      );


    gifts[i].name =
      nameInput.value.trim()
      || "ギフト";


    gifts[i].count =
      Math.max(
        2,
        Number(
          countInput.value
        ) || 2
      );

  }


  updateGiftButtons();

  closeSettings();

  startGame();

}


/* ========================================
   ギフト表示更新
======================================== */

function updateGiftButtons(){

  document
    .querySelectorAll(".gift-btn")
    .forEach(
      (btn,index)=>{

        btn.textContent =
          gifts[index].name;

      }
    );

}


/* ========================================
   シャッフル
======================================== */

function shuffle(array){

  for(
    let i=array.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );


    [
      array[i],
      array[j]
    ] =
    [
      array[j],
      array[i]
    ];

  }

}


/* ========================================
   カード作成
======================================== */

function createCards(){

  const board =
    document.getElementById("board");

  board.innerHTML = "";

  board.className =
    "c" + cardCount;


  const data=[];


  for(
    let i=0;
    i<cardCount/2;
    i++
  ){

    const pair =
      pairs[i] || ["",""];


    const imgs =
      pairImages[i] || {
        a:null,
        b:null
      };


    data.push({

      pairId:i,

      text:pair[0],

      image:imgs.a

    });


    data.push({

      pairId:i,

      text:pair[1],

      image:imgs.b

    });

  }


  shuffle(data);


  data.forEach(
    (item,index)=>{

      const card =
        document.createElement("div");

      card.className =
        "card";


      card.dataset.index =
        index;


      card.dataset.pairId =
        item.pairId;


      let frontHTML;


      if(item.image){

        frontHTML =
          `<img src="${item.image}" alt="">`;

      }else{

        frontHTML =
          `<div class="card-text">
            ${esc(item.text)}
          </div>`;

      }


      card.innerHTML = `

        <div class="card-inner">

          <div class="card-back">

            <div class="card-number">
              ${index+1}
            </div>

          </div>


          <div class="card-front">

            ${frontHTML}

          </div>

        </div>

      `;


      card.addEventListener(
        "click",
        function(){

          selectCard(card);

        }
      );


      board.appendChild(card);

    }
  );

}


/* ========================================
   カード選択
======================================== */

function selectCard(card){

  if(lockBoard)return;


  if(
    card.classList.contains("matched")
  ){

    return;

  }


  if(
    card.classList.contains("flipped")
  ){

    return;

  }


  /*
    ギフト候補が有効な場合、
    候補以外は選択できない
  */

  if(
    selectedGift !== null &&
    candidateIndexes.length > 0
  ){

    const index =
      Number(
        card.dataset.index
      );


    if(
      !candidateIndexes.includes(index)
    ){

      document
        .getElementById(
          "message"
        )
        .textContent =
        "候補カードから選んでね！";

      return;

    }

  }


  card.classList.add(
    "flipped"
  );


  if(!firstCard){

    firstCard =
      card;


    document
      .getElementById(
        "statusMain"
      )
      .textContent =
      "もう1枚選んでね！";

    return;

  }


  secondCard =
    card;


  /*
    ★重要
    2枚目を選択した瞬間に
    候補表示を消す
  */

  clearCandidates();


  checkMatch();

}


/* ========================================
   ペア判定
======================================== */

function checkMatch(){

  const firstPair =
    Number(
      firstCard.dataset.pairId
    );


  const secondPair =
    Number(
      secondCard.dataset.pairId
    );


  if(
    firstPair === secondPair
  ){

    firstCard.classList.add(
      "matched"
    );


    secondCard.classList.add(
      "matched"
    );


    matchedPairs++;


    document
      .getElementById(
        "statusMain"
      )
      .textContent =
      "🎉 ペア成立！";


    firstCard=null;

    secondCard=null;


    updateStatus();


    if(
      matchedPairs >=
      cardCount / 2
    ){

      setTimeout(
        showComplete,
        600
      );

    }

  }else{

    lockBoard=true;


    document
      .getElementById(
        "statusMain"
      )
      .textContent =
      "❌ ペアではありません";


    setTimeout(
      function(){

        if(firstCard){

          firstCard.classList.remove(
            "flipped"
          );

        }


        if(secondCard){

          secondCard.classList.remove(
            "flipped"
          );

        }


        firstCard=null;

        secondCard=null;

        lockBoard=false;


        document
          .getElementById(
            "statusMain"
          )
          .textContent =
          "もう一度選んでね！";

      },
      850
    );

  }

}


/* ========================================
   ギフトボタン
======================================== */

document
  .querySelectorAll(".gift-btn")
  .forEach(
    btn=>{

      btn.addEventListener(
        "click",
        function(){

          activateGift(
            Number(
              this.dataset.gift
            )
          );

        }
      );

    }
  );


/* ========================================
   ギフト選択
======================================== */

function activateGift(giftIndex){

  if(lockBoard)return;


  selectedGift =
    giftIndex;


  document
    .querySelectorAll(".gift-btn")
    .forEach(
      btn=>{
        btn.classList.remove(
          "active"
        );
      }
    );


  const active =
    document.querySelector(
      `.gift-btn[data-gift="${giftIndex}"]`
    );


  if(active){

    active.classList.add(
      "active"
    );

  }


  const available=[];


  document
    .querySelectorAll(".card")
    .forEach(
      (card,index)=>{

        if(
          !card.classList.contains(
            "matched"
          ) &&
          !card.classList.contains(
            "flipped"
          )
        ){

          available.push(index);

        }

      }
    );


  shuffle(available);


  candidateIndexes =
    available.slice(
      0,
      Math.min(
        gifts[giftIndex].count,
        available.length
      )
    );


  showCandidates();


  document
    .getElementById(
      "statusMain"
    )
    .textContent =
    "候補から2枚選んでね！";


  document
    .getElementById(
      "message"
    )
    .textContent =
    gifts[giftIndex].name +
    "：候補カードが出ました！";

}


/* ========================================
   候補表示
======================================== */

function showCandidates(){

  const area =
    document.getElementById(
      "candidateArea"
    );


  const list =
    document.getElementById(
      "candidates"
    );


  list.innerHTML="";


  candidateIndexes.forEach(
    index=>{

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "candidate";


      /*
        候補にはカード番号を
        大きく表示
      */

      item.textContent =
        index + 1;


      item.addEventListener(
        "click",
        function(){

          const cards =
            document.querySelectorAll(
              ".card"
            );


          if(cards[index]){

            selectCard(
              cards[index]
            );

          }

        }
      );


      list.appendChild(item);

    }
  );


  area.style.display =
    "flex";

}


/* ========================================
   候補を完全消去
======================================== */

function clearCandidates(){

  candidateIndexes=[];

  selectedGift=null;


  const area =
    document.getElementById(
      "candidateArea"
    );


  area.style.display =
    "none";


  document
    .querySelectorAll(".gift-btn")
    .forEach(
      btn=>{
        btn.classList.remove(
          "active"
        );
      }
    );

}


/* ========================================
   ステータス
======================================== */

function updateStatus(){

  document
    .getElementById(
      "statusSub"
    )
    .textContent =
    "ペア " +
    matchedPairs +
    " / " +
    (cardCount / 2);

}


/* ========================================
   ゲーム開始
======================================== */

function startGame(){

  matchedPairs=0;

  firstCard=null;

  secondCard=null;

  lockBoard=false;

  clearCandidates();

  createCards();

  updateStatus();


  document
    .getElementById(
      "statusMain"
    )
    .textContent =
    "ギフトを選んでね！";


  document
    .getElementById(
      "message"
    )
    .textContent =
    "指定ギフトで候補を絞れます！";

}


/* ========================================
   完成画面
======================================== */

function showComplete(){

  const screen =
    document.getElementById(
      "completeScreen"
    );


  const img =
    document.getElementById(
      "completeImage"
    );


  if(completeImageData){

    img.src =
      completeImageData;

    img.style.display =
      "block";

  }else{

    img.removeAttribute(
      "src"
    );

    img.style.display =
      "none";

  }


  screen.classList.add(
    "show"
  );

}


/* ========================================
   設定ボタン
======================================== */

document
  .getElementById("settingBtn")
  .addEventListener(
    "click",
    function(e){

      e.preventDefault();

      e.stopPropagation();

      openSettings();

    }
  );


/* ========================================
   閉じる
======================================== */

document
  .getElementById("closeBtn")
  .addEventListener(
    "click",
    function(){

      closeSettings();

    }
  );


/* ========================================
   保存
======================================== */

document
  .getElementById("saveBtn")
  .addEventListener(
    "click",
    function(){

      saveSettings();

    }
  );


/* ========================================
   開始
======================================== */

document
  .getElementById("startBtn")
  .addEventListener(
    "click",
    function(){

      startGame();

    }
  );


/* ========================================
   リセット
======================================== */

document
  .getElementById("resetBtn")
  .addEventListener(
    "click",
    function(){

      startGame();

    }
  );


/* ========================================
   完成画面を閉じる
======================================== */

document
  .getElementById("completeClose")
  .addEventListener(
    "click",
    function(){

      document
        .getElementById(
          "completeScreen"
        )
        .classList.remove(
          "show"
        );


      startGame();

    }
  );


/* ========================================
   初期化
======================================== */

updateGiftButtons();

createPairSettings();

startGame();

</script>
