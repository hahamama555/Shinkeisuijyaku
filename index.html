<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">

<title>ギフト神経衰弱</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Yu Gothic",
    sans-serif;
}

button,
input{
  font:inherit;
}

button{
  -webkit-appearance:none;
  appearance:none;
  touch-action:manipulation;
  cursor:pointer;
}

/* =========================================
   9:16 STAGE
========================================= */

#stage{
  position:fixed;
  left:50%;
  top:50%;

  width:min(100vw,56.25vh);
  height:min(100vh,177.7778vw);

  transform:translate(-50%,-50%);

  background:#101010;

  overflow:hidden;

  z-index:1;
}

/* =========================================
   GAME
========================================= */

#gameScreen{
  position:relative;

  width:100%;
  height:100%;

  display:flex;
  flex-direction:column;

  padding:
    1.5%
    1.5%
    1.5%;

  overflow:hidden;
}

/* =========================================
   HEADER
========================================= */

.header{
  flex:0 0 7%;

  min-height:0;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  overflow:hidden;

  text-align:center;
}

.title{
  font-size:5.2%;

  font-weight:900;

  line-height:1;

  white-space:nowrap;
}

.subtitle{
  margin-top:1%;

  font-size:2.4%;

  color:#aaa;

  white-space:nowrap;
}

/* =========================================
   STATUS
========================================= */

.status{
  flex:0 0 6.5%;

  min-height:0;

  background:#222;

  border-radius:10px;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  overflow:hidden;
}

.status-main{
  font-size:3.4%;

  font-weight:900;

  line-height:1;
}

.status-sub{
  margin-top:1%;

  font-size:2.2%;

  color:#aaa;

  line-height:1;
}

/* =========================================
   CANDIDATES
========================================= */

#candidateArea{
  flex:0 0 10%;

  min-height:0;

  display:none;

  flex-direction:column;

  justify-content:center;

  overflow:hidden;

  padding:0.3% 0;
}

.candidate-title{
  flex:0 0 27%;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:2.8%;

  font-weight:900;

  color:#ffd400;

  white-space:nowrap;
}

.candidates{
  flex:1;

  min-height:0;

  width:100%;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:0.7%;

  overflow:hidden;

  padding:0 0.3%;
}

.candidate{
  flex:1 1 0;

  min-width:0;

  height:90%;

  max-width:11.5%;

  aspect-ratio:1/1;

  border:2px solid #ffd400;

  border-radius:12%;

  background:#333;

  color:#fff;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:5%;

  font-weight:900;

  line-height:1;

  text-shadow:
    0 2px 3px #000;

  box-shadow:
    0 0 8px rgba(255,212,0,.45);

  overflow:hidden;
}

/* 7枚以上 */

.candidates:has(.candidate:nth-child(7))
.candidate{
  font-size:4.2%;

  max-width:10.5%;
}

/* 10枚以上 */

.candidates:has(.candidate:nth-child(10))
.candidate{
  font-size:3.7%;

  max-width:8.5%;
}

/* 12枚 */

.candidates:has(.candidate:nth-child(12))
.candidate{
  font-size:3.4%;

  max-width:7.5%;
}

.candidate:active{
  transform:scale(.92);

  background:#ffd400;

  color:#111;
}

/* =========================================
   BOARD
========================================= */

.board-area{
  flex:1 1 auto;

  min-height:0;

  display:flex;

  align-items:center;
  justify-content:center;

  overflow:hidden;

  padding:0.5% 0;
}

#board{
  width:100%;
  height:100%;

  min-width:0;
  min-height:0;

  display:grid;

  align-content:center;

  justify-content:center;

  overflow:hidden;
}

/* 16枚 */

#board.c16{
  grid-template-columns:
    repeat(4,1fr);

  gap:1.3%;
}

/* 24枚 */

#board.c24{
  grid-template-columns:
    repeat(6,1fr);

  gap:1%;
}

/* 36枚 */

#board.c36{
  grid-template-columns:
    repeat(6,1fr);

  gap:.75%;
}

/* 48枚 */

#board.c48{
  grid-template-columns:
    repeat(8,1fr);

  gap:.65%;
}

/* =========================================
   CARD
========================================= */

.card{
  width:100%;

  aspect-ratio:1/1;

  min-width:0;
  min-height:0;

  perspective:800px;

  touch-action:manipulation;
}

.card-inner{
  width:100%;
  height:100%;

  position:relative;

  transform-style:preserve-3d;

  transition:
    transform .32s ease;
}

.card.flipped .card-inner,
.card.matched .card-inner{
  transform:rotateY(180deg);
}

.card-front,
.card-back{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  border-radius:8%;

  overflow:hidden;

  backface-visibility:hidden;
}

/* =========================================
   CARD BACK
========================================= */

.card-back{
  background:
    linear-gradient(
      135deg,
      #4734c8,
      #a52bc7
    );

  border:
    2px solid #fff;

  display:flex;

  align-items:center;
  justify-content:center;
}

.card-number{
  font-size:4%;

  font-weight:900;

  color:#fff;

  opacity:.8;

  text-shadow:
    0 2px 3px #000;
}

/* =========================================
   CARD FRONT
========================================= */

.card-front{
  transform:rotateY(180deg);

  background:#fff;

  border:
    2px solid #fff;

  display:flex;

  align-items:center;
  justify-content:center;
}

.card-front img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}

.card-text{
  width:100%;

  padding:5%;

  color:#111;

  text-align:center;

  font-size:7%;

  font-weight:900;

  line-height:1.1;

  word-break:break-word;
}

.card.matched .card-front{
  border-color:#ffd400;

  box-shadow:
    0 0 10px #ffd400;
}

/* =========================================
   BOTTOM
========================================= */

.bottom{
  flex:0 0 12%;

  min-height:0;

  display:flex;

  flex-direction:column;

  justify-content:flex-end;

  overflow:hidden;
}

/* =========================================
   GIFTS
========================================= */

.gifts{
  flex:0 0 45%;

  min-height:0;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:1%;

  align-items:center;

  overflow:hidden;
}

.gift-btn{
  width:100%;
  height:72%;

  border:0;

  border-radius:8px;

  background:#333;

  color:#fff;

  font-size:2.1%;

  font-weight:900;

  white-space:nowrap;

  overflow:hidden;
}

.gift-btn.active{
  background:#ffd400;

  color:#111;
}

/* =========================================
   CONTROLS
========================================= */

.controls{
  flex:0 0 55%;

  min-height:0;

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:1%;

  align-items:center;

  overflow:hidden;
}

.control{
  height:70%;

  border:0;

  border-radius:8px;

  font-size:2.5%;

  font-weight:900;
}

.start{
  background:#ffd400;

  color:#111;
}

.reset{
  background:#444;

  color:#fff;
}

.setting-open{
  background:#333;

  color:#fff;
}

/* =========================================
   SETTINGS OVERLAY
========================================= */

#settings{
  position:fixed;

  inset:0;

  z-index:5000;

  display:none;

  background:#111;

  overflow-y:auto;

  overflow-x:hidden;

  padding:
    max(15px,env(safe-area-inset-top))
    15px
    max(30px,env(safe-area-inset-bottom))
    15px;

  touch-action:auto;
}

#settings.show{
  display:block;
}

.settings-inner{
  width:100%;

  max-width:600px;

  margin:0 auto;
}

.settings-title{
  text-align:center;

  font-size:24px;

  font-weight:900;

  margin-bottom:12px;
}

.section{
  background:#222;

  border-radius:10px;

  padding:10px;

  margin-bottom:10px;
}

.section-title{
  text-align:center;

  font-size:15px;

  font-weight:900;

  margin-bottom:8px;
}

/* =========================================
   COUNT
========================================= */

.count-grid{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:6px;
}

.count-btn{
  border:0;

  background:#444;

  color:#fff;

  padding:10px 2px;

  border-radius:6px;

  font-weight:900;
}

.count-btn.selected{
  background:#ffd400;

  color:#111;
}

/* =========================================
   PAIR
========================================= */

.pair-box{
  background:#171717;

  border-radius:8px;

  padding:8px;

  margin-bottom:8px;
}

.pair-header{
  color:#ffd400;

  font-size:13px;

  font-weight:900;

  margin-bottom:6px;
}

.pair-name{
  width:100%;

  padding:8px;

  border:1px solid #555;

  border-radius:6px;

  background:#333;

  color:#fff;

  margin-bottom:7px;
}

.card-settings{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:7px;
}

.card-setting{
  background:#292929;

  border-radius:6px;

  padding:6px;
}

.card-label{
  font-size:11px;

  color:#aaa;

  margin-bottom:4px;
}

.card-text-input{
  width:100%;

  padding:8px;

  border:1px solid #555;

  border-radius:5px;

  background:#333;

  color:#fff;

  margin-bottom:5px;
}

.preview{
  width:100%;

  aspect-ratio:1/1;

  background:#333;

  border-radius:5px;

  display:flex;

  align-items:center;
  justify-content:center;

  overflow:hidden;

  color:#fff;

  font-size:22px;

  margin-bottom:5px;

  text-align:center;
}

.preview img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.image-label{
  display:block;

  background:#444;

  color:#fff;

  text-align:center;

  padding:8px 2px;

  border-radius:5px;

  font-size:11px;
}

.image-input{
  display:none;
}

/* =========================================
   GIFTS SETTINGS
========================================= */

.gift-setting{
  display:grid;

  grid-template-columns:
    1fr 80px;

  gap:8px;

  align-items:center;

  margin-bottom:7px;

  font-size:13px;
}

.gift-setting input{
  width:100%;

  padding:8px;

  background:#333;

  color:#fff;

  border:1px solid #555;

  border-radius:5px;
}

/* =========================================
   COMPLETE IMAGE SETTINGS
========================================= */

.complete-preview{
  width:100%;

  height:150px;

  background:#333;

  border-radius:8px;

  display:flex;

  align-items:center;
  justify-content:center;

  overflow:hidden;

  color:#aaa;

  text-align:center;

  margin-bottom:7px;
}

.complete-preview img{
  width:100%;
  height:100%;

  object-fit:contain;
}

.complete-label{
  display:block;

  background:#444;

  padding:10px;

  border-radius:6px;

  text-align:center;

  font-size:12px;
}

.complete-input{
  display:none;
}

/* =========================================
   SETTING BUTTONS
========================================= */

.save-btn,
.close-btn{
  display:block;

  width:100%;

  border:0;

  padding:12px;

  border-radius:7px;

  font-weight:900;

  margin-top:7px;

  touch-action:manipulation;
}

.save-btn{
  background:#ffd400;

  color:#111;
}

.close-btn{
  background:#444;

  color:#fff;
}

/* =========================================
   COMPLETE SCREEN
========================================= */

#completeScreen{
  position:fixed;

  inset:0;

  z-index:6000;

  display:none;

  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.96);

  padding:15px;

  overflow:hidden;
}

#completeScreen.show{
  display:flex;
}

.complete-box{
  width:100%;

  max-width:600px;

  text-align:center;
}

.complete-title{
  color:#ffd400;

  font-size:
    clamp(28px,8vw,50px);

  font-weight:900;

  margin-bottom:10px;
}

#completeImage{
  width:100%;

  max-height:75vh;

  object-fit:contain;

  border:3px solid #fff;

  border-radius:10px;
}

.complete-message{
  color:#fff;

  font-size:16px;

  margin-bottom:8px;
}

.complete-close{
  width:100%;

  margin-top:10px;

  border:0;

  background:#ffd400;

  color:#111;

  padding:12px;

  border-radius:7px;

  font-weight:900;
}

/* =========================================
   SMALL SCREEN
========================================= */

@media(max-height:700px){

  .candidate-title{
    font-size:2.5%;
  }

  .bottom{
    flex-basis:11%;
  }

}
</style>

<!-- =================================================
     GAME

<div id="stage">

      <div class="controls">

        <button

          id="startBtn">
          🎮 開始
        </button>

        <button
          class="control reset"

          🔄 リセット
        </button>

        <button
          class="control setting-open"

          ⚙️ 設定
        </button>

      </div>

    </div>

  </div>

</div>


<!-- =================================================
     SETTINGS
================================================= -->

<div id="settings">

  <div class="settings-inner">

    <div class="settings-title">
      ⚙️ ゲーム設定
    </div>


    <!-- 枚数 -->

    <div class="section">

      <div class="section-title">
        🎴 カード枚数
      </div>

      <div class="count-grid">

        <button
          class="count-btn selected"
          data-count="16">
          16枚
        </button>

        <button
          class="count-btn"
          data-count="24">
          24枚
        </button>

        <button
          class="count-btn"
          data-count="36">
          36枚
        </button>

        <button
          class="count-btn"
          data-count="48">
          48枚
        </button>

      </div>

    </div>


    <!-- ペア -->

    <div class="section">

      <div class="section-title">
        🔗 ペアカード設定
      </div>

      <div id="pairList"></div>

    </div>


    <!-- ギフト -->

    <div class="section">

      <div class="section-title">
        🎁 ギフトで候補を絞る
      </div>

      <div class="gift-setting">

        <div>
          ❤️ ハートミー
        </div>

        <input
          id="gift0"
          type="number"
          min="2"
          value="4">

      </div>


      <div class="gift-setting">

        <div>
          🍩 ドーナツ
        </div>

        <input
          id="gift1"
          type="number"
          min="2"
          value="6">

      </div>


      <div class="gift-setting">

        <div>
          🎁 ギフトA
        </div>

        <input
          id="gift2"
          type="number"
          min="2"
          value="8">

      </div>


      <div class="gift-setting">

        <div>
          ⭐ 特別
        </div>

        <input
          id="gift3"
          type="number"
          min="2"
          value="12">

      </div>

    </div>


    <!-- 完成画像 -->

    <div class="section">

      <div class="section-title">
        🎉 全部揃った時の画像
      </div>

      <div
        id="completePreview"
        class="complete-preview">
        ここに完成画像が表示されます
      </div>


      <label class="complete-label">

        📷 完成画像を選択

        <input
          id="completeInput"
          class="complete-input"
          type="file"
          accept="image/*">

      </label>

    </div>


    <button
      class="save-btn"
      id="saveBtn">
      💾 保存してゲーム開始
    </button>


    <button
      class="close-btn"
      id="closeBtn">
      ✕ 閉じる
    </button>

  </div>

</div>


<!-- =================================================
     COMPLETE
================================================= -->

<div id="completeScreen">

  <div class="complete-box">

    <div class="complete-title">
      🎉 全ペア完成！ 🎉
    </div>

    <div
      class="complete-message">
      おめでとう！
    </div>

    <img
      id="completeImage"
      alt="完成画像">

    <button
      class="complete-close"
      id="completeClose">
      🔄 もう一度ゲームする
    </button>

  </div>

</div>

/* =================================================
   ESCAPE
================================================= */

function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent =
    text || "";

  return div.innerHTML;

}


function escapeAttr(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


/* =================================================
   SETTINGS OPEN
================================================= */

function openSettings(){

  document
    .getElementById("settings")
    .classList.add("show");

  createPairInputs();

================================================= */

/* =================================================
   CREATE PAIR SETTINGS
================================================= */

function createPairInputs(){

  const list =
    document.getElementById("pairList");

  list.innerHTML = "";


  const pairCount =
    cardCount / 2;


  for(
    let i=0;
    i<pairCount;
    i++
  ){

    if(!pairs[i]){

      pairs[i] = {

        name:"",

        a:"",

        b:"",

        imageA:null,

        imageB:null

      };

    }


    const p =
      pairs[i];


    const box =
      document.createElement("div");

    box.className =
      "pair-box";


    box.innerHTML = `

      <div class="pair-header">
        🔗 ペア ${i+1}
      </div>

      <input
        class="pair-name"
        id="pair-name-${i}"
        value="${escapeAttr(p.name)}"
        placeholder="ペア名（例：京都名物）">

      <div class="card-settings">

        <div class="card-setting">

          <div class="card-label">
            カード①
          </div>

          <input
            class="card-text-input"
            id="text-a-${i}"
            value="${escapeAttr(p.a)}"
            placeholder="京都">

          <div
            class="preview"
            id="preview-a-${i}">
          </div>

          <label class="image-label">

            📷 画像を設定

            <input
              class="image-input"
              type="file"
              accept="image/*"
              data-index="${i}"
              data-side="a">

          </label>

        </div>


        <div class="card-setting">

          <div class="card-label">
            カード②
          </div>

          <input
            class="card-text-input"
            id="text-b-${i}"
            value="${escapeAttr(p.b)}"
            placeholder="八ツ橋">

          <div
            class="preview"
            id="preview-b-${i}">
          </div>

          <label class="image-label">

            📷 画像を設定

            <input
              class="image-input"
              type="file"
              accept="image/*"
              data-index="${i}"
              data-side="b">

          </label>

        </div>

      </div>
    `;


    list.appendChild(box);


    updatePreview(i,"a");

    updatePreview(i,"b");

  }


  document
    .querySelectorAll(".image-input")
    .forEach(input=>{

      input.addEventListener(
        "change",
        function(){

          const index =
            Number(
              this.dataset.index
            );

          const side =
            this.dataset.side;

          const file =
            this.files[0];

          if(!file)return;


          const reader =
            new FileReader();


          reader.onload =
            function(e){

              if(side === "a"){

                pairs[index].imageA =
                  e.target.result;

              }else{

                pairs[index].imageB =
                  e.target.result;

              }


              updatePreview(
                index,
                side
              );

            };


          reader.readAsDataURL(file);

        }
      );

    });

}


/* =================================================
   PREVIEW
================================================= */

function updatePreview(
  index,
  side
){

  const preview =
    document.getElementById(
      `preview-${side}-${index}`
    );

  if(!preview)return;


  const image =
    side === "a"
      ? pairs[index].imageA
      : pairs[index].imageB;


  const text =
    side === "a"
      ? pairs[index].a
      : pairs[index].b;


  if(image){

    preview.innerHTML =
      `<img src="${image}" alt="">`;

  }else{

    preview.textContent =
      text || "画像なし";

  }

}

/* =================================================
   SHUFFLE
================================================= */

function shuffle(array){

  for(
    let i=array.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );


    [
      array[i],
      array[j]
    ] =
    [
      array[j],
      array[i]
    ];

  }

}


/* =================================================
   CREATE CARDS
================================================= */

function createCards(){

  const board =
    document.getElementById("board");

  board.innerHTML = "";

  board.className =
    "c" + cardCount;


  const data = [];


  const pairCount =
    cardCount / 2;


  for(
    let i=0;
    i<pairCount;
    i++
  ){

    data.push({

      pairId:i,

      text:pairs[i].a,

      image:pairs[i].imageA

    });


    data.push({

      pairId:i,

      text:pairs[i].b,

      image:pairs[i].imageB

    });

  }


  shuffle(data);


  data.forEach(
    (item,index)=>{

      const card =
        document.createElement("div");

      card.className =
        "card";


      card.dataset.index =
        index;


      card.dataset.pairId =
        item.pairId;


      let content;


      if(item.image){

        content =
          `<img
            src="${item.image}"
            alt="">`;

      }else{

        content =
          `<div class="card-text">
            ${escapeHTML(
              item.text || "？"
            )}
          </div>`;

      }


      card.innerHTML = `

        <div class="card-inner">

          <div class="card-back">

            <div class="card-number">
              ${index+1}
            </div>

          </div>

          <div class="card-front">

            ${content}

          </div>

        </div>
      `;


      card.addEventListener(
        "click",
        function(){

          selectCard(card);

        }
      );


      board.appendChild(card);

    }
  );

}


/* =================================================
   SELECT CARD
================================================= */

function selectCard(card){

  if(lockBoard)return;


  if(
    card.classList.contains(
      "matched"
    )
  )return;


  if(
    card.classList.contains(
      "flipped"
    )
  )return;


  if(
    selectedGift !== null &&
    candidateIndexes.length > 0
  ){

    const index =
      Number(
        card.dataset.index
      );


    if(
      !candidateIndexes
        .includes(index)
    ){

      document
        .getElementById(
          "message"
        )
        .textContent =
        "黄色の候補カードから選んでね！";

      return;

    }

  }


  card.classList.add(
    "flipped"
  );


  if(!firstCard){

    firstCard =
      card;


    document
      .getElementById(
        "statusMain"
      )
      .textContent =
      "もう1枚選んでね！";

    return;

  }


  secondCard =
    card;


  checkMatch();

}


/* =================================================
   CHECK MATCH
================================================= */

function checkMatch(){

  const firstPair =
    Number(
      firstCard.dataset.pairId
    );


  const secondPair =
    Number(
      secondCard.dataset.pairId
    );


  if(
    firstPair === secondPair
  ){

    firstCard.classList.add(
      "matched"
    );

    secondCard.classList.add(
      "matched"
    );


    matchedPairs++;


    const pairName =
      pairs[firstPair].name ||
      "ペア成立！";


    document
      .getElementById(
        "statusMain"
      )
      .textContent =
      "🎉 " +
      pairName +
      " ペア成立！";


    firstCard = null;

    secondCard = null;


    clearCandidates();

    updateStatus();


    if(
      matchedPairs >=
      cardCount / 2
    ){

      setTimeout(
        showComplete,
        700
      );

    }

  }else{

    lockBoard = true;


    document
      .getElementById(
        "statusMain"
      )
      .textContent =
      "❌ ペアではありません";


    setTimeout(
      function(){

        firstCard.classList.remove(
          "flipped"
        );

        secondCard.classList.remove(
          "flipped"
        );


        firstCard = null;

        secondCard = null;

        lockBoard = false;


        document
          .getElementById(
            "statusMain"
          )
          .textContent =
          "もう一度選んでね！";

      },
      850
    );

  }

}

/* =================================================
   ACTIVATE GIFT
================================================= */

function activateGift(gift){

  selectedGift =
    gift;


  document
    .querySelectorAll(
      ".gift-btn"
    )
    .forEach(btn=>{
      btn.classList.remove(
        "active"
      );
    });


  document
    .querySelector(
      `.gift-btn[data-gift="${gift}"]`
    )
    .classList.add(
      "active"
    );


  const available = [];


  document
    .querySelectorAll(
      ".card"
    )
    .forEach(
      function(card,index){

        if(
          !card.classList.contains(
            "matched"
          ) &&
          !card.classList.contains(
            "flipped"
          )
        ){

          available.push(index);

        }

      }
    );


  shuffle(available);


  candidateIndexes =
    available.slice(
      0,
      Math.min(
        giftCandidateCount[gift],
        available.length
      )
    );


  showCandidates();


  document
    .getElementById(
      "statusMain"
    )
    .textContent =
    "候補から2枚選んでね！";


  document
    .getElementById(
      "message"
    )
    .textContent =
    "🎁 指定ギフトで候補を絞っています";

}


/* =================================================
   SHOW CANDIDATES
================================================= */

function showCandidates(){

  const area =
    document.getElementById(
      "candidateArea"
    );


  const list =
    document.getElementById(
      "candidates"
    );


  list.innerHTML = "";


  candidateIndexes
    .forEach(
      function(index){

        const candidate =
          document.createElement(
            "div"
          );


        candidate.className =
          "candidate";


        /*
          数字を大きく表示
        */

        candidate.textContent =
          index + 1;


        candidate.addEventListener(
          "click",
          function(){

            const cards =
              document
                .querySelectorAll(
                  ".card"
                );


            const card =
              cards[index];


            if(card){

              selectCard(card);

            }

          }
        );


        list.appendChild(
          candidate
        );

      }
    );


  area.style.display =
    "flex";

}


/* =================================================
   CLEAR CANDIDATES
================================================= */

function clearCandidates(){

  candidateIndexes = [];

  selectedGift = null;


  document
    .getElementById(
      "candidateArea"
    )
    .style.display =
    "none";


  document
    .querySelectorAll(
      ".gift-btn"
    )
    .forEach(
      function(btn){

        btn.classList.remove(
          "active"
        );

      }
    );

}


/* =================================================
   STATUS
================================================= */

function updateStatus(){

  document
    .getElementById(
      "statusSub"
    )
    .textContent =
    "ペア " +
    matchedPairs +
    " / " +
    (cardCount / 2);

}


/* =================================================
   START
================================================= */

function startGame(){

  matchedPairs = 0;

  firstCard = null;

  secondCard = null;

  lockBoard = false;


  clearCandidates();

  createCards();

  updateStatus();


  document
    .getElementById(
      "statusMain"
    )
    .textContent =
    "ギフトを選んでね！";


  document
    .getElementById(
      "message"
    )
    .textContent =
    "指定ギフトで候補を絞れます！";

}


/* =================================================
   RESET
================================================= */

function resetGame(){

  startGame();

}


/* =================================================
   COMPLETE
================================================= */

function showComplete(){

  const screen =
    document.getElementById(
      "completeScreen"
    );


  const img =
    document.getElementById(
      "completeImage"
    );


  if(completeImageData){

    img.src =
      completeImageData;

    img.style.display =
      "block";

  }else{

    img.style.display =
      "none";

  }


  screen.classList.add(
    "show"
  );

}


/* =================================================
   CLOSE COMPLETE
================================================= */

function closeComplete(){

  document
    .getElementById(
      "completeScreen"
    )
    .classList.remove(
      "show"
    );


  startGame();

}
